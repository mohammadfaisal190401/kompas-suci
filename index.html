/* ============================================================
   STORAGE
   ============================================================ */
function loadLS(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch { return def; }
}
function saveLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

/* ============================================================
   DATE
   ============================================================ */
function startOfDay(d) { const n = new Date(d); n.setHours(0,0,0,0); return n; }
function toKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fromKey(k) {
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatDateShort(d) { return d.getDate() + ' ' + BULAN_PENDEK[d.getMonth()]; }
function formatDateFull(d) {
  return HARI_PENDEK[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN_PENDEK[d.getMonth()] + ' ' + d.getFullYear();
}

/* ============================================================
   SCORE (dengan bonus)
   ============================================================ */
function computeScore(sifat, nilai, checked, bonus = 0) {
  let base;
  if (sifat === 'wajib')  base = checked ? nilai : -nilai;
  else if (sifat === 'sunah')  base = checked ? nilai : 0;
  else if (sifat === 'makruh') base = checked ? 0 : nilai;
  else if (sifat === 'haram')  base = checked ? -nilai : nilai;
  else base = 0;
  return base + (checked ? (Number(bonus) || 0) : 0);
}

/* ============================================================
   PERIOD
   ============================================================ */
function getCurrentPeriodKey(amal, refDate = new Date()) {
  const d = startOfDay(refDate);
  if (amal.periode === 'harian') return toKey(d);
  if (amal.periode === 'mingguan') {
    const sun = new Date(d); sun.setDate(sun.getDate() - sun.getDay());
    return toKey(sun);
  }
  if (amal.periode === 'bulanan') return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  if (amal.periode === 'tahunan') return String(d.getFullYear());
  return toKey(d);
}

function getDeadlineDate(amal, periodKey) {
  if (amal.periode === 'harian') {
    const [y,m,d] = periodKey.split('-').map(Number);
    return new Date(y, m-1, d, 23, 59, 59);
  }
  if (amal.periode === 'mingguan') {
    const [y,m,d] = periodKey.split('-').map(Number);
    const sun = new Date(y, m-1, d);
    const dd = amal.deadlineDay ?? 6;
    const dl = new Date(sun); dl.setDate(dl.getDate() + dd);
    dl.setHours(23, 55, 0);
    return dl;
  }
  if (amal.periode === 'bulanan') {
    const [y,m] = periodKey.split('-').map(Number);
    const last = new Date(y, m, 0).getDate();
    const dd = Math.min(amal.deadlineDate ?? 28, last);
    return new Date(y, m-1, dd, 23, 55, 0);
  }
  if (amal.periode === 'tahunan') {
    const y = Number(periodKey);
    const m = amal.deadlineMonth ?? 12;
    const d = amal.deadlineDate ?? 31;
    return new Date(y, m-1, d, 23, 55, 0);
  }
  return new Date();
}

function getAllPeriodKeys(amal, untilDate = new Date()) {
  const keys = [];
  const start = startOfDay(new Date(amal.createdAt));
  const end = startOfDay(untilDate);
  if (start > end) return keys;
  if (amal.periode === 'harian') {
    for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) keys.push(toKey(d));
  } else if (amal.periode === 'mingguan') {
    const sun = new Date(start); sun.setDate(sun.getDate() - sun.getDay());
    for (let d = new Date(sun); d <= end; d.setDate(d.getDate()+7)) keys.push(toKey(d));
  } else if (amal.periode === 'bulanan') {
    let y = start.getFullYear(), m = start.getMonth();
    while (new Date(y, m, 1) <= end) {
      keys.push(y + '-' + String(m+1).padStart(2,'0'));
      m++; if (m > 11) { m = 0; y++; }
    }
  } else if (amal.periode === 'tahunan') {
    for (let y = start.getFullYear(); y <= end.getFullYear(); y++) keys.push(String(y));
  }
  return keys;
}

function computeEntries(amalList, records, now = new Date()) {
  const entries = [];
  amalList.forEach(amal => {
    const keys = getAllPeriodKeys(amal, now);
    keys.forEach(pk => {
      const record = records[amal.id]?.[pk];
      const checked = !!record?.checked;
      const bonus = record?.bonus || 0;
      const deadline = getDeadlineDate(amal, pk);
      const nilai = computeScore(amal.sifat, amal.nilai, checked, bonus);
      entries.push({
        amalId: amal.id,
        periodeKey: pk,
        tanggalApply: toKey(startOfDay(deadline)),
        deadline,
        checked,
        bonus,
        catatan: record?.catatan || '',
        nilai,
        sifat: amal.sifat,
        nama: amal.nama,
      });
    });
  });
  return entries.sort((a,b) => a.deadline - b.deadline);
}

function groupDeltasByDate(entries, limitKey) {
  const map = {};
  entries.forEach(e => {
    if (limitKey && e.tanggalApply > limitKey) return;
    map[e.tanggalApply] = (map[e.tanggalApply] || 0) + e.nilai;
  });
  return map;
}

/* ============================================================
   KOMPONEN: GRAFIK
   ============================================================ */
function ArahChart({ data, height = 180 }) {
  if (!data || data.length < 2) {
    return (
      <div className="flex items-center justify-center text-xs text-center px-4"
           style={{ color: 'var(--muted)', height }}>
        Belum cukup data untuk grafik.
      </div>
    );
  }
  if (data.every(d => d.cumScore === 0)) {
    return (
      <div className="flex items-center justify-center text-xs text-center px-4"
           style={{ color: 'var(--muted)', height }}>
        Belum ada aktivitas pada periode ini.
      </div>
    );
  }

  const w = 500, hh = height, pad = { l: 36, r: 12, t: 12, b: 24 };
  const innerW = w - pad.l - pad.r;
  const innerH = hh - pad.t - pad.b;
  const minY = Math.min(0, ...data.map(d => d.cumScore));
  const maxY = Math.max(0, ...data.map(d => d.cumScore));
  const rangeY = (maxY - minY) || 1;
  const points = data.map((d, i) => {
    const x = pad.l + (i / (data.length - 1)) * innerW;
    const y = pad.t + innerH - ((d.cumScore - minY) / rangeY) * innerH;
    return { x, y, d };
  });
  const lineD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaD = lineD + ' L' + points[points.length-1].x.toFixed(1) + ',' + (pad.t + innerH) + ' L' + points[0].x.toFixed(1) + ',' + (pad.t + innerH) + ' Z';
  const last = points[points.length-1];
  const zeroY = pad.t + innerH - ((0 - minY) / rangeY) * innerH;
  const isPositive = data[data.length-1].cumScore >= data[0].cumScore;
  const lineColor = isPositive ? 'var(--pos)' : 'var(--neg)';
  const labelAt = (d) => d.label || formatDateShort(fromKey(d.date));
  const showAllLabels = data.length <= 12;

  return (
    <svg viewBox={`0 0 ${w} ${hh}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
      {minY < 0 && maxY > 0 && (
        <line x1={pad.l} y1={zeroY} x2={w - pad.r} y2={zeroY}
              stroke="var(--line)" strokeDasharray="3 3" />
      )}
      <defs>
        <linearGradient id="gradArah" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={lineColor} stopOpacity="0.3" />
          <stop offset="100%" stopColor={lineColor} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={areaD} fill="url(#gradArah)" />
      <path d={lineD} fill="none" stroke={lineColor} strokeWidth="2.5"
            strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={last.x} cy={last.y} r="4" fill={lineColor} />
      <circle cx={last.x} cy={last.y} r="7" fill={lineColor} opacity="0.2" />
      <text x={pad.l - 4} y={pad.t + 8} textAnchor="end" fontSize="9" fill="var(--muted)">{maxY}</text>
      {minY < 0 && (
        <text x={pad.l - 4} y={pad.t + innerH} textAnchor="end" fontSize="9" fill="var(--muted)">{minY}</text>
      )}
      {showAllLabels ? (
        points.map((p, i) => (
          <text key={i} x={p.x} y={hh - 6}
                textAnchor={i === 0 ? 'start' : i === points.length-1 ? 'end' : 'middle'}
                fontSize="8" fill="var(--muted)">{labelAt(p.d)}</text>
        ))
      ) : (
        <>
          <text x={pad.l} y={hh - 6} textAnchor="start" fontSize="9" fill="var(--muted)">{labelAt(data[0])}</text>
          <text x={w - pad.r} y={hh - 6} textAnchor="end" fontSize="9" fill="var(--muted)">{labelAt(data[data.length-1])}</text>
        </>
      )}
    </svg>
  );
}

}

function dayOfYear(d) { return Math.round((startOfDay(d) - new Date(d.getFullYear(), 0, 1)) / 86400000) + 1; }
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 86400000 + 1) / 7);
}
function selisih(d, today) {
  const n = Math.round((startOfDay(d) - startOfDay(today)) / 86400000);
  if (n === 0) return "Hari ini";
  if (n === 1) return "Besok";
  if (n === -1) return "Kemarin";
  return n > 0 ? n + " hari lagi" : Math.abs(n) + " hari lalu";
}

  const s = localStorage.getItem(LS_RENCANA);
  if (!s) return [];
  const data = JSON.parse(s);
  if (!Array.isArray(data)) throw new Error("Format data catatan di browser tidak valid.");
  return data;
}
function simpanCatatanLokal(data) { localStorage.setItem(LS_RENCANA, JSON.stringify(data)); }
function buatIdCatatan() {
  if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
  return "catatan-" + Date.now() + "-" + Math.random().toString(36).slice(2, 9);
}

/* Catatan progres amal (dari sistem amal) */
function getNotes(rec) {
  if (Array.isArray(rec?.catatanItems)) return rec.catatanItems;
  return rec?.catatan?.trim() ? [{ id: 'legacy', title: 'Catatan', content: rec.catatan }] : [];
}
const sifatColor = s => s === 'haram' ? 'var(--haram)' : s === 'makruh' ? 'var(--makruh)' : 'var(--sunah)';

/* tanggal -> daftar { amal, periodeKey, record, missed } */
function buildDayMap(amalList, records, simDate) {
  const map = {};
  const todayKey = toKey(simDate);
  amalList.forEach(a => {
    const recs = records[a.id] || {};
    Object.keys(recs).forEach(pk => {
      const r = recs[pk];
      const k = a.periode === 'harian' ? pk : (r.checked ? (r.tanggalCheck || r.tanggalUpdate) : r.tanggalUpdate);
      if (!k || !(r.checked || getNotes(r).length)) return;
      (map[k] = map[k] || []).push({ amal: a, periodeKey: pk, record: r });
    });
    if (a.periode === 'harian') {
      getAllPeriodKeys(a, simDate).forEach(pk => {
        if (pk >= todayKey || recs[pk]?.checked) return;
        const ex = (map[pk] = map[pk] || []).find(i => i.amal.id === a.id);
        if (ex) ex.missed = true; else map[pk].push({ amal: a, periodeKey: pk, missed: true });
      });
    }
  });
  return map;
}

// cellInfo(d, inMonth) -> { color, dots: [{c, hollow}], fill }
function CalendarGrid({ today, selected, onSelect, cellInfo, compact }) {
  const [view, setView] = useState({ y: selected.getFullYear(), m: selected.getMonth() });
  const [picker, setPicker] = useState(null);
  const [yearBase, setYearBase] = useState(Math.floor(selected.getFullYear() / 12) * 12);
  const touch = useRef(null);
  useEffect(() => { setView({ y: selected.getFullYear(), m: selected.getMonth() }); }, [selected.getFullYear(), selected.getMonth()]);

  const goMonth = delta => { const d = new Date(view.y, view.m + delta, 1); setView({ y: d.getFullYear(), m: d.getMonth() }); };
  const first = new Date(view.y, view.m, 1).getDay();
  const total = Math.ceil((first + new Date(view.y, view.m + 1, 0).getDate()) / 7) * 7;
  const cells = Array.from({ length: total }, (_, i) => new Date(view.y, view.m, 1 - first + i));
  const onTouchStart = e => { touch.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = e => {
    if (!touch.current) return;
    const dx = e.changedTouches[0].clientX - touch.current.x;
    const dy = e.changedTouches[0].clientY - touch.current.y;
    touch.current = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) goMonth(dx < 0 ? 1 : -1);
  };
  const pickBtn = (label, active, onClick) => (
    <button key={label} onClick={onClick} className="py-3 rounded-2xl text-base font-medium active:scale-95 transition"
            style={active ? { background: 'var(--accent)', color: 'var(--accent-text)' } : { background: 'var(--soft)', color: 'var(--text)' }}>
      {label}
    </button>
  );

  let body;
  if (picker === 'month') {
    body = <div className="grid grid-cols-3 gap-2 p-3">
      {BULAN.map((n, i) => pickBtn(n, i === view.m, () => { setView({ y: view.y, m: i }); setPicker(null); }))}
    </div>;
  } else if (picker === 'year') {
    body = <div>
      <div className="flex items-center justify-between px-3 pt-3">
        <NavBtn dir="l" label="Tahun sebelumnya" onClick={() => setYearBase(yearBase - 12)} />
        <span className="text-sm" style={{ color: 'var(--muted)' }}>{yearBase + ' – ' + (yearBase + 11)}</span>
        <NavBtn dir="r" label="Tahun berikutnya" onClick={() => setYearBase(yearBase + 12)} />
      </div>
      <div className="grid grid-cols-3 gap-2 p-3">
        {Array.from({ length: 12 }, (_, i) => yearBase + i).map(y =>
          pickBtn(String(y), y === view.y, () => { setView({ y, m: view.m }); setPicker('month'); }))}
      </div>
    </div>;
  } else {
    body = <div className="px-2 pb-3" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
      <div className="grid grid-cols-7 py-2">
        {HARI_PENDEK.map((n, i) => (
          <div key={n} className="text-center text-xs font-semibold uppercase tracking-wide"
               style={{ color: i === 0 ? 'var(--weekend)' : 'var(--muted)' }}>{n}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-y-1">
        {cells.map(d => {
          const inMonth = d.getMonth() === view.m;
          const isToday = same(d, today), isSel = same(d, selected);
          const info = cellInfo(d, inMonth);
          let style = { color: inMonth ? info.color : 'var(--muted)' };
          if (!inMonth) style.opacity = 0.42;
          if (info.fill && inMonth) style = { background: info.fill, color: '#fff', fontWeight: 600 };
          if (isToday) style = { background: 'var(--accent)', color: 'var(--accent-text)', fontWeight: 700 };
          else if (isSel) style = { ...style, boxShadow: 'inset 0 0 0 2px var(--accent)', opacity: 1, ...(info.fill && inMonth ? {} : { background: 'var(--soft)' }) };
          return (
            <div key={d.getTime()} className="flex flex-col items-center">
              <button className="cell w-11 h-11 rounded-full text-base flex items-center justify-center transition relative"
                      style={style} aria-current={isToday ? 'date' : undefined}
                      aria-label={HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear()}
                      onClick={() => onSelect(startOfDay(d))}>{d.getDate()}</button>
              <div className="flex gap-[3px] h-1.5 mt-0.5">
                {info.dots.slice(0, 4).map((x, i) => <Dot key={i} color={x.c} hollow={x.hollow} />)}
              </div>
            </div>
          );
        })}
      </div>
    </div>;
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <div className="min-w-0">
          <button onClick={() => setPicker(picker === 'month' ? null : 'month')}
                  className={(compact ? 'text-xl' : 'text-2xl') + ' font-bold leading-tight active:opacity-60 block text-left truncate'}>
            {BULAN[view.m]}
          </button>
          <button onClick={() => { setYearBase(Math.floor(view.y / 12) * 12); setPicker(picker === 'year' ? null : 'year'); }}
                  className="block text-base font-medium active:opacity-60 text-left" style={{ color: 'var(--accent)' }}>
            {view.y}
          </button>
        </div>
        <div className="flex gap-2 shrink-0">
          <NavBtn dir="l" label="Bulan sebelumnya" onClick={() => { setPicker(null); goMonth(-1); }} />
          <NavBtn dir="r" label="Bulan berikutnya" onClick={() => { setPicker(null); goMonth(1); }} />
        </div>
      </div>
      <div className="rounded-3xl overflow-hidden" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>{body}</div>
    </div>
  );
}

/* ============================================================
   PANEL CATATAN AMAL PER TANGGAL (accordion per amal)
   ============================================================ */
function AmalDayPanel({ items, onManage, emptyText }) {
  const [open, setOpen] = useState({});
  if (!items.length) {

  return (
    <div className="space-y-2">
      {items.map(it => {

        const isOpen = open[key] ?? items.length === 1;
        const rec = it.record;
        const notes = getNotes(rec);
        const status = rec?.checked ? 'Dikerjakan' : it.missed ? 'Bolong' : 'Catatan';
        const sc = rec?.checked ? sifatColor(it.amal.sifat) : it.missed ? 'var(--neg)' : 'var(--muted)';
        return (
          <div key={key} className="rounded-xl overflow-hidden" style={{ background: 'var(--soft)' }}>

              <span style={{ color: 'var(--muted)' }}>{isOpen ? '▴' : '▾'}</span>
            </button>
            {isOpen && (
              <div className="px-3 pb-3">
                <div className="text-[11px] mb-2" style={{ color: 'var(--muted)' }}>
                  {SIFAT_INFO[it.amal.sifat].label + ' · ' + it.amal.nilai + ' poin · ' + it.amal.periode}
                  {rec?.checked && Number(rec.bonus) ? ' · bonus +' + rec.bonus : ''}
                </div>
                {notes.length === 0
                  ? <div className="text-xs" style={{ color: 'var(--muted)' }}>Belum ada catatan progres.</div>
                  : <div className="space-y-1.5">
                      {notes.map(n => (
                        <div key={n.id} className="rounded-lg p-2" style={{ background: 'var(--card)' }}>
                          <div className="text-xs font-semibold break-words">{n.title}</div>

                      ))}

                {onManage && (
                  <button onClick={() => onManage(it.amal, it.periodeKey)}
                          className="mt-2 px-3 py-1.5 rounded-full text-xs font-semibold active:scale-95"
                          style={{ background: 'var(--accent)', color: 'var(--accent-text)' }}>
                    {rec?.checked ? 'Kelola progres & catatan' : 'Centang / tulis catatan'}
                  </button>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ============================================================
   KALENDER PROGRES AMAL (di Lihat Semua) — hijau/kuning/merah sesuai sifat
   ============================================================ */
function AmalCalendar({ amalList, records, simDate, onManage }) {
  const [selected, setSelected] = useState(startOfDay(simDate));
  const dayMap = useMemo(() => buildDayMap(amalList, records, simDate), [amalList, records, simDate]);
  const single = amalList.length === 1;
  const cellInfo = (d) => {
    const items = dayMap[toKey(d)] || [];
    const dots = [];
    items.forEach(it => {
      if (it.record?.checked) dots.push({ c: sifatColor(it.amal.sifat) });
      else if (it.missed) dots.push({ c: 'var(--neg)', hollow: true });
    });
    const done = items.find(it => it.record?.checked);
    return {
      color: d.getDay() === 0 ? 'var(--weekend)' : 'var(--text)',
      dots: single ? (done ? [] : dots) : dots,
      fill: single && done ? sifatColor(done.amal.sifat) : null,
    };
  };
  const sel = dayMap[toKey(selected)] || [];
  return (
    <div>
      <CalendarGrid today={startOfDay(simDate)} selected={selected} onSelect={setSelected} cellInfo={cellInfo} compact />
      <div className="flex flex-wrap justify-center gap-x-3 gap-y-1 mt-2 mb-3 text-[10px]" style={{ color: 'var(--muted)' }}>
        <span className="flex items-center gap-1"><Dot color="var(--sunah)" />Dikerjakan (wajib/sunah)</span>
        <span className="flex items-center gap-1"><Dot color="var(--makruh)" />Makruh</span>
        <span className="flex items-center gap-1"><Dot color="var(--haram)" />Haram</span>
        <span className="flex items-center gap-1"><Dot color="var(--neg)" hollow />Bolong (harian)</span>
      </div>
      <div className="text-xs font-bold px-1 mb-2">{formatDateFull(selected)}</div>
      <AmalDayPanel key={toKey(selected)} items={sel} onManage={onManage}
                    emptyText="Tidak ada data progres atau catatan pada tanggal ini." />
    </div>
  );
}

  const [fStatus, setFStatus] = useState('rencana');
  const selectedKey = toKey(selected);

  const loadRencana = () => {
    setLoading(true); setError(null);
    try { setRencana(bacaCatatanLokal()); }

    finally { setLoading(false); }
  };
  useEffect(() => { loadRencana(); }, []);

  const byDate = useMemo(() => {
    const m = {};
    rencana.forEach(n => { if (n && n.tanggal) (m[n.tanggal] = m[n.tanggal] || []).push(n); });
    return m;
  }, [rencana]);
  const dayMap = useMemo(() => buildDayMap(amal, records, simDate), [amal, records, simDate]);

  const closeForm = () => { setShowForm(false); setEditing(null); setFJudul(''); setFCatatan(''); setFStatus('rencana'); };
  useEffect(() => { closeForm(); }, [selectedKey]);
  const openAdd = () => { closeForm(); setShowForm(true); };
  const openEdit = n => { setEditing(n); setFJudul(n.judul || ''); setFCatatan(n.catatan || ''); setFStatus(n.status === 'selesai' ? 'selesai' : 'rencana'); setShowForm(true); };

  const submitForm = () => {
    if (!fJudul.trim()) { alert('Judul catatan wajib diisi.'); return; }
    setSaving(true);
    try {
      const lama = bacaCatatanLokal();
      let baru;
      if (editing) {
        if (!lama.some(n => String(n.id) === String(editing.id))) throw new Error('Catatan yang ingin diedit tidak ditemukan.');
        baru = lama.map(n => String(n.id) === String(editing.id)
          ? { ...n, judul: fJudul.trim(), catatan: fCatatan.trim(), status: fStatus, diperbaruiPada: new Date().toISOString() } : n);

            {!showForm && <button onClick={openAdd} className="px-3 py-1.5 rounded-full text-xs font-semibold active:scale-95 transition" style={{ background: 'var(--accent)', color: 'var(--accent-text)' }}>+ Tambah</button>}
            <button onClick={loadRencana} aria-label="Muat ulang rencana" className="w-8 h-8 rounded-full flex items-center justify-center active:scale-90 transition" style={{ background: 'var(--soft)', color: 'var(--muted)' }}>↻</button>
          </div>
        </div>
        {error && <div className="mx-1 mt-2 p-3 rounded-xl text-xs leading-relaxed" style={{ background: 'rgba(225,29,72,.1)', color: 'var(--weekend)' }}><div className="font-bold mb-1">Penyimpanan lokal bermasalah</div>{error}</div>}
        {loading && <div className="text-xs px-1 py-3" style={{ color: 'var(--muted)' }}>Memuat catatan...</div>}
        {showForm && (
          <div className="mt-1 p-3 rounded-2xl" style={{ background: 'var(--soft)' }}>
            <div className="text-[11px] font-semibold mb-2" style={{ color: 'var(--accent)' }}>
              {(editing ? 'Edit rencana · ' : 'Rencana baru · ') + formatDateShort(selected) + ' ' + selected.getFullYear()}
            </div>
            <input value={fJudul} onChange={e => setFJudul(e.target.value)} placeholder="Judul (mis. Meeting dengan tim)" maxLength={120} className="w-full px-3 py-2.5 rounded-xl text-sm mb-2" style={inputStyle} />
            <textarea value={fCatatan} onChange={e => setFCatatan(e.target.value)} placeholder="Detail catatan (opsional)..." rows={3} maxLength={1000} className="w-full px-3 py-2.5 rounded-xl text-sm mb-2 resize-none" style={inputStyle} />
            <select value={fStatus} onChange={e => setFStatus(e.target.value)} className="w-full px-3 py-2.5 rounded-xl text-sm mb-3" style={inputStyle}>
              <option value="rencana">Rencana</option>
              <option value="selesai">Selesai</option>
            </select>
            <div className="flex gap-2">
              <button onClick={submitForm} disabled={saving} className="flex-1 py-2.5 rounded-xl text-sm font-semibold active:scale-[.98] transition" style={{ background: 'var(--accent)', color: 'var(--accent-text)', opacity: saving ? 0.6 : 1 }}>{saving ? 'Menyimpan...' : 'Simpan'}</button>
              <button onClick={closeForm} disabled={saving} className="px-4 py-2.5 rounded-xl text-sm font-medium active:scale-[.98] transition" style={inputStyle}>Batal</button>
            </div>
          </div>
        )}
        {!showForm && (selRencana.length === 0
          ? <div className="text-sm px-1 py-3" style={{ color: 'var(--muted)' }}>{'Belum ada rencana. Ketuk "Tambah" untuk membuat rencana.'}</div>
          : <div className="space-y-2 mt-1">
              {selRencana.map(n => (
                <div key={n.id} className="flex items-start gap-2 p-2.5 rounded-xl" style={{ background: 'var(--soft)' }}>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="text-sm font-semibold break-words">{n.judul}</span>
                      <span className="text-[10px] px-1.5 py-0.5 rounded-full font-semibold shrink-0"
                            style={n.status === 'selesai' ? { background: '#059669', color: '#fff' } : { background: 'var(--card)', color: 'var(--accent)', border: '1px solid var(--accent)' }}>
                        {n.status === 'selesai' ? 'Selesai' : 'Rencana'}
                      </span>
                    </div>
                    {n.catatan && <div className="text-xs mt-1 leading-relaxed whitespace-pre-wrap break-words" style={{ color: 'var(--muted)' }}>{n.catatan}</div>}
                  </div>
                  <div className="flex flex-col gap-1 shrink-0">
                    <button onClick={() => openEdit(n)} aria-label="Edit rencana" className="w-7 h-7 rounded-full flex items-center justify-center active:scale-90 transition text-xs" style={{ background: 'var(--card)', color: 'var(--accent)' }}>✎</button>
                    <button onClick={() => handleDelete(n.id)} aria-label="Hapus rencana" className="w-7 h-7 rounded-full flex items-center justify-center active:scale-90 transition text-xs" style={{ background: 'var(--card)', color: 'var(--weekend)' }}>🗑</button>
                  </div>
                </div>
              ))}
            </div>)}
      </div>

      {/* CATATAN PROGRES AMAL — dari sistem amal (data terpisah dari rencana) */}
      <div className="mt-4 rounded-3xl p-4" style={card}>
        <div className="flex items-center gap-2 px-1 pb-2">
          <span className="text-sm font-bold">Catatan Progres Amal</span>
          {selAmal.length > 0 && <span className="text-[10px] px-1.5 py-0.5 rounded-full font-semibold" style={{ background: 'var(--soft)', color: 'var(--accent)' }}>{selAmal.length}</span>}
        </div>
        <AmalDayPanel key={selectedKey} items={selAmal} onManage={onManage} emptyText="Belum ada catatan progres amal pada tanggal ini." />
      </div>

      <div className="mt-4 rounded-3xl p-4" style={card}>
        <div className="flex items-baseline justify-between px-1 pb-2">
          <div className="text-sm font-bold">{'Hari Besar ' + BULAN[monthM] + ' ' + monthY}</div>
          <div className="text-[11px]" style={{ color: 'var(--muted)' }}>{jmlLibur > 0 ? jmlLibur + ' hari libur/cuti' : 'tidak ada libur'}</div>
        </div>
        {!HARI_LIBUR[monthY] && <div className="text-[11px] px-1 pb-2 leading-snug" style={{ color: 'var(--cuti)' }}>{'Data libur nasional tahun ' + monthY + ' belum tersedia.'}</div>}
        {daftarBulan.length === 0
          ? <div className="text-sm px-1 py-3" style={{ color: 'var(--muted)' }}>Tidak ada hari besar pada bulan ini.</div>
          : daftarBulan.map((x, i) => (
              <button key={i} onClick={() => setSelected(startOfDay(x.tanggal))}
                      className="list-item w-full flex items-start gap-3 py-2 px-1 text-left transition"
                      style={same(x.tanggal, selected) ? { background: 'var(--soft)', borderRadius: 14 } : null}>
                <div className="w-10 shrink-0 text-center pt-0.5">
                  <div className="text-base font-bold leading-none" style={{ color: warnaJenis(x.jenis) }}>{x.tanggal.getDate()}</div>
                  <div className="text-[10px] uppercase mt-1" style={{ color: 'var(--muted)' }}>{HARI_PENDEK[x.tanggal.getDay()]}</div>
                </div>
                <div className="flex-1 min-w-0 pt-0.5">
                  <div className="text-sm font-medium leading-snug">{x.nama}</div>
                  <div className="text-[11px] mt-0.5" style={{ color: warnaJenis(x.jenis) }}>{labelJenis(x.jenis)}</div>
                </div>
              </button>
            ))}
      </div>

      <button onClick={() => setSelected(today)} className="mt-4 w-full py-3.5 rounded-2xl text-base font-semibold active:scale-[.98] transition" style={{ background: 'var(--accent)', color: 'var(--accent-text)' }}>Kembali ke hari ini</button>
      <p className="text-center text-xs mt-3 leading-relaxed" style={{ color: 'var(--muted)' }}>Geser kiri atau kanan untuk ganti bulan. Ketuk nama bulan atau tahun untuk memilih cepat.</p>
    </div>
  );
}

/* ============================================================
   KOMPONEN: FORM AMAL (tambah/edit template amal)
   ============================================================ */
function AmalForm({ initial, onSave, onCancel }) {
  const [nama, setNama] = useState(initial?.nama || '');
  const [sifat, setSifat] = useState(initial?.sifat || 'wajib');
  const [nilai, setNilai] = useState(initial?.nilai ?? 1);
  const [periode, setPeriode] = useState(initial?.periode || 'harian');
  const [deadlineDay, setDeadlineDay] = useState(initial?.deadlineDay ?? 6);
  const [deadlineDate, setDeadlineDate] = useState(initial?.deadlineDate ?? 28);
  const [deadlineMonth, setDeadlineMonth] = useState(initial?.deadlineMonth ?? 12);

  const submit = () => {
    if (!nama.trim()) { alert('Nama amal wajib diisi'); return; }
    const n = Number(nilai);
    if (!n || n <= 0) { alert('Nilai harus > 0'); return; }
    onSave({
      nama: nama.trim(),
      sifat,
      nilai: n,
      periode,
      deadlineDay: Number(deadlineDay),
      deadlineDate: Number(deadlineDate),
      deadlineMonth: Number(deadlineMonth),
    });
  };

  return (
    <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center"
         style={{ background: 'rgba(0,0,0,.5)', backdropFilter: 'blur(3px)' }}
         onClick={onCancel}>
      <div
        className="w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto"
        style={{ background: 'var(--card)', color: 'var(--text)' }}
        onClick={e => e.stopPropagation()}>

        <div className="flex items-center justify-between mb-4">
          <div className="text-lg font-bold">{initial ? 'Edit Amal' : 'Tambah Amal'}</div>
          <button onClick={onCancel}
                  className="w-8 h-8 rounded-full flex items-center justify-center"
                  style={{ background: 'var(--soft)', color: 'var(--muted)' }}>✕</button>
        </div>

        <label className="block text-xs font-semibold mb-1.5" style={{ color: 'var(--muted)' }}>Nama Amal</label>
        <input
          value={nama} onChange={e => setNama(e.target.value)}
          placeholder="mis. Mandi, Olahraga, Belajar Inggris..."
          maxLength={80}
          className="w-full px-3 py-2.5 rounded-xl text-sm mb-3"
          style={{ background: 'var(--soft)', color: 'var(--text)', border: '1px solid var(--line)' }} />

        <label className="block text-xs font-semibold mb-1.5" style={{ color: 'var(--muted)' }}>Sifat</label>
        <div className="grid grid-cols-2 gap-2 mb-1">
          {Object.keys(SIFAT_INFO).map(k => (
            <button key={k} onClick={() => setSifat(k)}
                    className="py-2.5 rounded-xl text-sm font-semibold transition active:scale-95 flex items-center justify-center gap-1.5"
                    style={{
                      background: sifat === k ? SIFAT_INFO[k].color : 'var(--soft)',
                      color: sifat === k ? '#fff' : 'var(--text)',
                    }}>
              <span>{SIFAT_INFO[k].icon}</span>
              <span>{SIFAT_INFO[k].label}</span>
            </button>
          ))}
        </div>
        <div className="text-[10px] mb-3 text-center" style={{ color: 'var(--muted)' }}>
          {SIFAT_INFO[sifat].desc}
        </div>

        <label className="block text-xs font-semibold mb-1.5" style={{ color: 'var(--muted)' }}>Nilai (bobot poin per periode)</label>
        <input
          type="number" min="1" value={nilai}
          onChange={e => setNilai(e.target.value)}
          className="w-full px-3 py-2.5 rounded-xl text-sm mb-3"
          style={{ background: 'var(--soft)', color: 'var(--text)', border: '1px solid var(--line)' }} />

        <label className="block text-xs font-semibold mb-1.5" style={{ color: 'var(--muted)' }}>Periode</label>
        <div className="grid grid-cols-4 gap-1.5 mb-3">
          {['harian','mingguan','bulanan','tahunan'].map(p => (
            <button key={p} onClick={() => setPeriode(p)}
                    className="py-2 rounded-xl text-xs font-semibold transition active:scale-95"
                    style={{
                      background: periode === p ? 'var(--accent)' : 'var(--soft)',
                      color: periode === p ? 'var(--accent-text)' : 'var(--text)',
                    }}>
              {p.charAt(0).toUpperCase() + p.slice(1)}
            </button>
          ))}
        </div>

        {periode === 'mingguan' && (
          <div>
            <label className="block text-xs font-semibold mb-1.5" style={{ color: 'var(--muted)' }}>Deadline (hari)</label>
            <div className="grid grid-cols-7 gap-1 mb-3">
              {['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map((nm, i) => (
                <button key={i} onClick={() => setDeadlineDay(i)}
                        className="py-2 rounded-lg text-xs font-semibold transition active:scale-95"
                        style={{
                          background: deadlineDay === i ? 'var(--accent)' : 'var(--soft)',
                          color: deadlineDay === i ? 'var(--accent-text)' : 'var(--text)',
                        }}>
                  {nm}
                </button>
              ))}
            </div>
          </div>
        )}

        {periode === 'bulanan' && (
          <div>
            <label className="block text-xs font-semibold mb-1.5" style={{ color: 'var(--muted)' }}>Deadline (tanggal)</label>
            <input
              type="number" min="1" max="31" value={deadlineDate}
              onChange={e => setDeadlineDate(e.target.value)}
              className="w-full px-3 py-2.5 rounded-xl text-sm mb-3"
              style={{ background: 'var(--soft)', color: 'var(--text)', border: '1px solid var(--line)' }} />
          </div>
        )}

        {periode === 'tahunan' && (
          <div>
            <label className="block text-xs font-semibold mb-1.5" style={{ color: 'var(--muted)' }}>Deadline (bulan & tanggal)</label>
            <div className="grid grid-cols-2 gap-2 mb-3">
              <input
                type="number" min="1" max="12" value={deadlineMonth}
                onChange={e => setDeadlineMonth(e.target.value)}
                placeholder="Bulan"
                className="w-full px-3 py-2.5 rounded-xl text-sm"
                style={{ background: 'var(--soft)', color: 'var(--text)', border: '1px solid var(--line)' }} />
              <input
                type="number" min="1" max="31" value={deadlineDate}
                onChange={e => setDeadlineDate(e.target.value)}
                placeholder="Tanggal"
                className="w-full px-3 py-2.5 rounded-xl text-sm"
                style={{ background: 'var(--soft)', color: 'var(--text)', border: '1px solid var(--line)' }} />
            </div>
          </div>
        )}

        <div className="flex gap-2 mt-2">
          <button onClick={submit}
                  className="flex-1 py-3 rounded-xl text-sm font-bold active:scale-[.98] transition"
                  style={{ background: 'var(--accent)', color: 'var(--accent-text)' }}>
            Simpan
          </button>
          <button onClick={onCancel}
                  className="px-4 py-3 rounded-xl text-sm font-medium active:scale-[.98] transition"
                  style={{ background: 'var(--soft)', color: 'var(--text)' }}>
            Batal
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   KOMPONEN: POPUP AMAL (konfirmasi / bonus / edit done)
   ============================================================ */
function AmalPopup({ amal, periodeKey, record, onSave, onSaveNotes, onUncheck, onClose }) {
  const isDone = !!record?.checked;
  const [step, setStep] = useState(isDone ? 'edit' : 'konfirmasi');
  const legacyNotes = record?.catatan?.trim()
    ? [{ id: 'legacy-' + amal.id + '-' + periodeKey, title: 'Catatan lama', content: record.catatan }]
    : [];
  const notes = Array.isArray(record?.catatanItems) ? record.catatanItems : legacyNotes;
  const [noteListOpen, setNoteListOpen] = useState(false);
  const [selectedNoteId, setSelectedNoteId] = useState(
    notes.length === 1 ? notes[0].id : null
  );
  const selectedNote = notes.find(n => n.id === selectedNoteId) || null;
  const [catatan, setCatatan] = useState(notes.length === 1 ? notes[0].content : '');
  const [judul, setJudul] = useState(notes.length === 1 ? notes[0].title : '');
  const [bonus, setBonus] = useState(record?.bonus ? String(record.bonus) : '');
  const [confirmOpen, setConfirmOpen] = useState(false);

  const info = SIFAT_INFO[amal.sifat];
  const updateDraft = (note) => {
    setSelectedNoteId(note?.id || null);
    setCatatan(note?.content || '');
    setJudul(note?.title || '');
    setNoteListOpen(false);
  };
  const saveNote = (asNew = false) => {
    const content = catatan.trim();
    const title = judul.trim() || (content ? content.split('\n')[0].slice(0, 36) : 'Catatan tanpa judul');
    let nextNotes;
    if (selectedNoteId && !asNew) {
      nextNotes = notes.map(n => n.id === selectedNoteId ? { ...n, title, content } : n);
    } else {
      nextNotes = [...notes, { id: 'note-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), title, content }];
    }
    onSaveNotes(nextNotes);
  };
  const getNotesWithDraft = () => {
    if (!selectedNoteId && !catatan.trim() && !judul.trim()) return notes;
    const content = catatan.trim();
    const title = judul.trim() || (content ? content.split('\n')[0].slice(0, 36) : 'Catatan tanpa judul');
    if (selectedNoteId) {
      return notes.map(n => n.id === selectedNoteId ? { ...n, title, content } : n);
    }
    if (!content && !judul.trim()) return notes;
    return [...notes, { id: 'note-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), title, content }];
  };
  const handleNoteSaveClick = () => {
    if (!catatan.trim() && !judul.trim()) {
      alert('Tulis judul atau isi catatan terlebih dahulu.');
      return;
    }
    if (notes.length === 0) {
      saveNote(false);
    } else {
      setConfirmOpen(true);
    }
  };
  const deleteSelectedNote = () => {
    if (!selectedNoteId) return;
    if (!window.confirm('Hapus catatan ini?')) return;
    const nextNotes = notes.filter(n => n.id !== selectedNoteId);
    onSaveNotes(nextNotes);
    updateDraft(null);
  };

  const frame = (children) => (
    <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center"
         style={{
           background: 'rgba(0,0,0,.5)', backdropFilter: 'blur(3px)',
           paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 48px)',
           paddingLeft: '12px', paddingRight: '12px',
         }}
         onClick={onClose}>
      <div
        className="w-full sm:max-w-md rounded-3xl p-5 max-h-[82vh] overflow-y-auto"
        style={{ background: 'var(--card)', color: 'var(--text)' }}
        onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg flex items-center justify-center text-sm"
                 style={{ background: info.color, color: '#fff' }}>{info.icon}</div>
            <div>
              <div className="text-base font-bold leading-tight">{amal.nama}</div>
              <div className="text-[10px]" style={{ color: 'var(--muted)' }}>
                {info.label} · {amal.nilai} poin · {amal.periode}
              </div>
            </div>
          </div>
          <button onClick={onClose}
                  className="w-8 h-8 rounded-full flex items-center justify-center"
                  style={{ background: 'var(--soft)', color: 'var(--muted)' }}>✕</button>
        </div>
        {children}
        {confirmOpen && (
          <div className="fixed inset-0 z-[80] flex items-center justify-center p-4"
               style={{ background: 'rgba(0,0,0,.58)' }}
               onClick={() => setConfirmOpen(false)}>
            <div className="w-full max-w-sm rounded-2xl p-4"
                 style={{ background: 'var(--card)', color: 'var(--text)' }}
                 onClick={e => e.stopPropagation()}>
              <div className="font-bold text-sm mb-1">Simpan catatan?</div>
              <div className="text-xs mb-4" style={{ color: 'var(--muted)' }}>
                {selectedNoteId
                  ? 'Pilih apakah catatan ini diperbarui atau disimpan sebagai catatan terpisah.'
                  : 'Catatan ini akan ditambahkan sebagai catatan terpisah.'}
              </div>
              <div className="grid gap-2">
                {selectedNoteId && (
                  <button onClick={() => saveNote(false)}
                          className="w-full py-2.5 rounded-xl text-sm font-semibold"
                          style={{ background: 'var(--accent)', color: 'var(--accent-text)' }}>
                    Simpan perubahan
                  </button>
                )}
                <button onClick={() => saveNote(true)}
                        className="w-full py-2.5 rounded-xl text-sm font-semibold"
                        style={{ background: 'var(--soft)', color: 'var(--text)' }}>
                  Simpan sebagai catatan terpisah
                </button>
                <button onClick={() => setConfirmOpen(false)}
                        className="w-full py-2 rounded-xl text-xs"
                        style={{ color: 'var(--muted)' }}>Batal</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );

  const notesEditor = (
    <>
      {notes.length > 0 && (
        <button onClick={() => setNoteListOpen(v => !v)}
                className="w-full text-left px-3 py-2 rounded-xl text-xs font-semibold mb-2"
                style={{ background: 'var(--soft)', color: 'var(--accent)' }}>
          {noteListOpen ? '▲ Sembunyikan catatan' : '📝 Daftar catatan (' + notes.length + ')'}
        </button>
      )}
      {noteListOpen && (
        <div className="rounded-xl p-2 mb-3 space-y-1" style={{ background: 'var(--soft)' }}>
          {notes.map(note => (
            <button key={note.id} onClick={() => updateDraft(note)}
                    className="w-full text-left px-2.5 py-2 rounded-lg text-xs font-medium"
                    style={{
                      background: selectedNoteId === note.id ? 'var(--accent)' : 'transparent',
                      color: selectedNoteId === note.id ? 'var(--accent-text)' : 'var(--text)'
                    }}>
              {note.title || 'Tanpa judul'}
            </button>
          ))}
        </div>
      )}
      <div className="flex items-center gap-2 mb-2">
        <button onClick={() => updateDraft(null)}
                className="px-3 py-1.5 rounded-lg text-[11px] font-semibold"
                style={{ background: 'var(--soft)', color: 'var(--accent)' }}>
          + Tambah catatan
        </button>
        {selectedNoteId && (
          <button onClick={deleteSelectedNote}
                  className="px-3 py-1.5 rounded-lg text-[11px] font-semibold"
                  style={{ background: 'var(--soft)', color: 'var(--neg)' }}>
            Hapus
          </button>
        )}
      </div>
      <label className="block text-xs font-semibold mb-1.5" style={{ color: 'var(--muted)' }}>
        Judul catatan
      </label>
      <input value={judul} onChange={e => setJudul(e.target.value)}
             placeholder="Beri judul agar mudah ditemukan..."
             maxLength={60}
             className="w-full px-3 py-2.5 rounded-xl text-sm mb-2"
             style={{ background: 'var(--soft)', color: 'var(--text)', border: '1px solid var(--line)' }} />
      <label className="block text-xs font-semibold mb-1.5" style={{ color: 'var(--muted)' }}>
        Catatan (opsional)
      </label>
      <textarea value={catatan} onChange={e => setCatatan(e.target.value)}
                placeholder="Catatan, rencana, atau refleksi..."
                rows={3} maxLength={500}
                className="w-full px-3 py-2.5 rounded-xl text-sm mb-3 resize-none"
                style={{ background: 'var(--soft)', color: 'var(--text)', border: '1px solid var(--line)' }} />
      <button onClick={handleNoteSaveClick}

             style={{ color: 'var(--accent)' }}>Sudah dikerjakan · edit</div>

                  className="flex-1 py-3 rounded-xl text-sm font-bold"
                  style={{ background: 'var(--accent)', color: 'var(--accent-text)' }}>Simpan progres</button>
        </div>

    );
  }

  if (step === 'konfirmasi') {
    return frame(
      <>
        {notesEditor}
        <div className="text-sm font-semibold text-center py-2">
          Apakah kamu sudah mengerjakan amal ini?

        <div className="flex gap-2 mt-1">

                  style={{ background: 'var(--accent)', color: 'var(--accent-text)' }}>Iya</button>
        </div>
      </>
    );
  }

  if (step === 'belum') {
    return frame(
      <>
        <div className="text-sm font-semibold text-center py-2">Progres tidak dicentang.</div>
        <div className="text-xs text-center mb-3" style={{ color: 'var(--muted)' }}>

  return frame(
    <>

           style={{ color: 'var(--accent)' }}>Tambahkan bonus pahala</div>
      <label className="block text-xs font-semibold mb-1.5" style={{ color: 'var(--muted)' }}>
        Bonus Pahala (opsional)
      </label>
      <input type="number" value={bonus} onChange={e => setBonus(e.target.value)}
             placeholder="0" className="w-full px-3 py-2.5 rounded-xl text-sm mb-1"
             style={{ background: 'var(--soft)', color: 'var(--text)', border: '1px solid var(--line)' }} />

      </div>
      <div className="flex gap-2">
        <button onClick={() => setStep('konfirmasi')} className="flex-1 py-3 rounded-xl text-sm font-semibold"
                style={{ background: 'var(--soft)', color: 'var(--text)' }}>Kembali</button>
        <button onClick={() => onSave({ checked: true, catatan: catatan.trim(), catatanItems: getNotesWithDraft(), bonus: Number(bonus) || 0 })}

                style={{ background: 'var(--accent)', color: 'var(--accent-text)' }}>Submit</button>
      </div>
    </>
  );

/* ============================================================
   KOMPONEN: FULL DATA VIEW
   ============================================================ */
function FullDataView({ mode, amalId, allAmal, records, simDate, onClose, onManage }) {
  const [periodType, setPeriodType] = useState('bulan');
  const [offset, setOffset] = useState(0);

  const amalList = useMemo(() => {
    if (mode === 'all') return allAmal;
    return allAmal.filter(a => a.id === amalId);
  }, [mode, amalId, allAmal]);
  const amalObj = mode === 'single' ? allAmal.find(a => a.id === amalId) : null;

  const { points, title, subtitle } = useMemo(() => {
    const entries = computeEntries(amalList, records, simDate);
    const deltasByDate = groupDeltasByDate(entries, toKey(simDate));

    if (periodType === 'minggu') {
      const base = new Date(simDate);
      base.setDate(base.getDate() + offset * 7);
      const startSun = new Date(base);
      startSun.setDate(startSun.getDate() - startSun.getDay());
      startSun.setHours(0,0,0,0);
      const endSat = new Date(startSun);
      endSat.setDate(endSat.getDate() + 6);

      let cum = 0;
      Object.keys(deltasByDate).forEach(k => { if (k < toKey(startSun)) cum += deltasByDate[k]; });

      const pts = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(startSun); d.setDate(d.getDate() + i);
        const k = toKey(d);
        const delta = deltasByDate[k] || 0;
        cum += delta;
        pts.push({ date: k, cumScore: cum, delta });
      }
      return {
        points: pts,
        title: 'Mingguan',
        subtitle: formatDateShort(startSun) + ' – ' + formatDateShort(endSat) + ' ' + endSat.getFullYear(),
      };
    }

    if (periodType === 'bulan') {
      const monthIdx = simDate.getMonth() + offset;
      const d0 = new Date(simDate.getFullYear(), monthIdx, 1);
      const y = d0.getFullYear();
      const m = d0.getMonth();
      const daysInMonth = new Date(y, m+1, 0).getDate();

      let cum = 0;
      Object.keys(deltasByDate).forEach(k => { if (fromKey(k) < d0) cum += deltasByDate[k]; });

      const pts = [];
      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(y, m, day);
        const k = toKey(d);
        const delta = deltasByDate[k] || 0;
        cum += delta;
        pts.push({ date: k, cumScore: cum, delta });
      }
      return {
        points: pts,
        title: 'Bulanan',
        subtitle: ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][m] + ' ' + y,
      };
    }

    const y = simDate.getFullYear() + offset;
    let cum = 0;
    Object.keys(deltasByDate).forEach(k => { if (fromKey(k).getFullYear() < y) cum += deltasByDate[k]; });

    const pts = [];
    for (let m = 0; m < 12; m++) {
      const daysInMonth = new Date(y, m+1, 0).getDate();
      let monthDelta = 0;
      for (let day = 1; day <= daysInMonth; day++) {
        const k = toKey(new Date(y, m, day));
        monthDelta += deltasByDate[k] || 0;
      }
      cum += monthDelta;
      pts.push({
        date: y + '-' + String(m+1).padStart(2, '0') + '-01',
        label: BULAN_PENDEK[m],
        cumScore: cum,
        delta: monthDelta,
      });
    }
    return {
      points: pts,
      title: 'Tahunan',
      subtitle: String(y),
    };
  }, [periodType, offset, simDate, records, amalList]);

  const stats = useMemo(() => {
    const netInPeriod = points.reduce((s, p) => s + (p.delta || 0), 0);
    const lastCum = points[points.length - 1]?.cumScore || 0;
    const posCount = points.filter(p => (p.delta || 0) > 0).length;
    const negCount = points.filter(p => (p.delta || 0) < 0).length;
    return { netInPeriod, lastCum, posCount, negCount };
  }, [points]);

  return (
    <div className="fixed inset-0 z-[60] flex flex-col"
         style={{
           background: 'var(--bg)', color: 'var(--text)',
           paddingTop: 'env(safe-area-inset-top, 0px)',
           paddingBottom: 'env(safe-area-inset-bottom, 0px)',
         }}>
      <div className="flex items-center gap-3 p-4 shrink-0"
           style={{ background: 'var(--card)', borderBottom: '1px solid var(--line)' }}>
        <button onClick={onClose}
                className="w-10 h-10 rounded-full flex items-center justify-center shrink-0 active:scale-90"
                style={{ background: 'var(--soft)', color: 'var(--text)' }}>←</button>
        <div className="flex-1 min-w-0">
          <div className="text-base font-bold truncate">
            {mode === 'all' ? 'Semua Amal' : (amalObj?.nama || 'Amal')}
          </div>
          <div className="text-[11px] truncate" style={{ color: 'var(--muted)' }}>
            {mode === 'all'
              ? 'Kumulatif semua amal'
              : (amalObj ? SIFAT_INFO[amalObj.sifat].label + ' · ' + amalObj.nilai + ' poin · ' + amalObj.periode : '')}
          </div>
        </div>
      </div>

      <div className="p-3 shrink-0"
           style={{ background: 'var(--card)', borderBottom: '1px solid var(--line)' }}>
        <div className="grid grid-cols-3 gap-1 p-1 rounded-2xl" style={{ background: 'var(--soft)' }}>
          {[['minggu','Mingguan'],['bulan','Bulanan'],['tahun','Tahunan']].map(([k, l]) => (
            <button key={k} onClick={() => { setPeriodType(k); setOffset(0); }}
                    className="py-2 rounded-xl text-xs font-semibold transition active:scale-95"
                    style={{
                      background: periodType === k ? 'var(--accent)' : 'transparent',
                      color: periodType === k ? 'var(--accent-text)' : 'var(--text)',
                    }}>{l}</button>
          ))}
        </div>
      </div>

      <div className="flex items-center justify-between p-3 shrink-0"
           style={{ background: 'var(--card)', borderBottom: '1px solid var(--line)' }}>
        <button onClick={() => setOffset(o => o - 1)}
                className="w-10 h-10 rounded-full flex items-center justify-center active:scale-90"
                style={{ background: 'var(--soft)', color: 'var(--text)' }}>◀</button>
        <div className="flex-1 text-center px-2">
          <div className="text-[10px] uppercase font-semibold tracking-wide" style={{ color: 'var(--muted)' }}>{title}</div>
          <div className="text-sm font-bold truncate">{subtitle}</div>
          {offset !== 0 && (
            <div className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--accent)' }}>
              {offset > 0 ? '+' + offset + ' ke depan' : offset + ' ke belakang'}
            </div>
          )}
        </div>
        <button onClick={() => setOffset(o => o + 1)}
                className="w-10 h-10 rounded-full flex items-center justify-center active:scale-90"
                style={{ background: 'var(--soft)', color: 'var(--text)' }}>▶</button>
      </div>

      <div className="flex-1 overflow-y-auto p-4 space-y-4">
        <div className="rounded-3xl p-4" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
          <ArahChart data={points} height={220} />
          <div className="grid grid-cols-2 gap-2 mt-4">
            <div className="rounded-xl p-2.5" style={{ background: 'var(--soft)' }}>
              <div className="text-[10px] font-semibold uppercase" style={{ color: 'var(--muted)' }}>Perubahan Periode</div>
              <div className="text-lg font-bold"
                   style={{ color: stats.netInPeriod > 0 ? 'var(--pos)' : stats.netInPeriod < 0 ? 'var(--neg)' : 'var(--muted)' }}>
                {(stats.netInPeriod >= 0 ? '+' : '') + stats.netInPeriod}
              </div>
            </div>
            <div className="rounded-xl p-2.5" style={{ background: 'var(--soft)' }}>
              <div className="text-[10px] font-semibold uppercase" style={{ color: 'var(--muted)' }}>Kumulatif Akhir</div>
              <div className="text-lg font-bold">{(stats.lastCum >= 0 ? '+' : '') + stats.lastCum}</div>
            </div>
            <div className="rounded-xl p-2.5" style={{ background: 'var(--soft)' }}>
              <div className="text-[10px] font-semibold uppercase" style={{ color: 'var(--muted)' }}>Positif</div>
              <div className="text-lg font-bold" style={{ color: 'var(--pos)' }}>{stats.posCount}x</div>
            </div>
            <div className="rounded-xl p-2.5" style={{ background: 'var(--soft)' }}>
              <div className="text-[10px] font-semibold uppercase" style={{ color: 'var(--muted)' }}>Negatif</div>
              <div className="text-lg font-bold" style={{ color: 'var(--neg)' }}>{stats.negCount}x</div>
            </div>
          </div>
        </div>
        <CalendarSection mode={mode} amalList={amalList} records={records} simDate={simDate} onManage={onManage} />
      </div>
    </div>
  );
}

/* ============================================================
   KOMPONEN: ACCORDION AMAL (yang belum dikerjakan)
   ============================================================ */
function AmalAccordion({ item, expanded, onToggleExpand, onClickAmal, chartData, onOpenFull, isDone = false }) {
  const a = item.amal;
  const info = SIFAT_INFO[a.sifat];
  const isForbidden = a.sifat === 'makruh' || a.sifat === 'haram';
  const checkLabel = isDone
    ? 'Edit progres amal'
    : (isForbidden ? 'Saya melanggar' : 'Saya mengerjakan');
  const record = item.record || {};
  const hasCatatan = !!(
    (record.catatan && record.catatan.trim()) ||
    (Array.isArray(record.catatanItems) && record.catatanItems.length > 0)
  );
  const currentDelta = computeScore(a.sifat, a.nilai, isDone, isDone ? (record.bonus || 0) : 0);

  return (
    <div className="rounded-2xl overflow-hidden mb-2"
         style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
      <div className="flex items-center gap-2 p-3">
        <button
          onClick={e => { e.stopPropagation(); onClickAmal(); }}
          className="w-11 h-11 rounded-full flex items-center justify-center shrink-0 active:scale-90 transition font-bold text-base"
          style={{
            background: isDone ? 'var(--pos)' : 'var(--soft)',
            color: isDone ? '#fff' : 'var(--muted)',
            border: isDone ? 'none' : '2px dashed var(--line)',
          }}
          title={checkLabel}>
          {isDone ? '✓' : ''}
        </button>

        <button
          onClick={() => onToggleExpand(a.id)}
          className="flex-1 min-w-0 text-left active:opacity-60 transition">
          <div className="flex items-center gap-1.5 flex-wrap">
            <span className="text-sm font-semibold">{a.nama}</span>
            <span className="text-[9px] px-1.5 py-0.5 rounded-full font-bold uppercase"
                  style={{ background: info.color + '22', color: info.color }}>{info.label}</span>
            <span className="text-[9px] px-1.5 py-0.5 rounded-full font-bold uppercase"
                  style={{ background: 'var(--soft)', color: 'var(--muted)' }}>{a.periode}</span>
            {hasCatatan && (
              <span className="text-[10px]" style={{ color: 'var(--accent)' }} title="Ada catatan">📝</span>
            )}
          </div>
          <div className="text-[10px] mt-0.5 flex items-center gap-2" style={{ color: 'var(--muted)' }}>
            <span>{isDone ? 'Sudah selesai' : checkLabel}</span>
            <span>·</span>
            <span>{a.nilai} poin</span>
          </div>
        </button>

        <div className="text-sm font-bold shrink-0 mr-1"
             style={{ color: currentDelta >= 0 ? 'var(--pos)' : 'var(--neg)' }}>
          {(currentDelta > 0 ? '+' : '') + currentDelta}
        </div>
        <div className="w-5 flex items-center justify-center shrink-0 transition-transform"
             style={{ transform: expanded ? 'rotate(180deg)' : 'rotate(0deg)', color: 'var(--muted)', fontSize: 10 }}>
          ▼
        </div>
      </div>

      {expanded && (
        <div className="px-3 pb-3 pt-3" style={{ borderTop: '1px solid var(--line)' }}>
          <div className="text-[10px] font-semibold uppercase mb-1 tracking-wide"
               style={{ color: 'var(--muted)' }}>30 hari terakhir</div>
          <ArahChart data={chartData} height={140} />
          <button
            onClick={e => { e.stopPropagation(); onOpenFull(); }}
            className="w-full mt-2 py-2 rounded-xl text-xs font-semibold active:scale-95 transition"
            style={{ background: 'var(--accent)', color: 'var(--accent-text)' }}>
            📊 Lihat Semua Data
          </button>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   KOMPONEN: ACCORDION DONE (amal yang sudah dikerjakan)
   ============================================================ */
function DoneAccordion({ title, items, expandedAmals, onToggleExpand, chartDataByAmal, onEdit, onOpenFull }) {
  const [open, setOpen] = useState(true);
  if (items.length === 0) return null;

  return (
    <div className="rounded-2xl overflow-hidden mb-2"
         style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
      <button
        onClick={() => setOpen(o => !o)}
        className="w-full flex items-center justify-between px-3 py-2.5 active:opacity-70 transition">
        <div className="flex items-center gap-2">
          <span className="text-xs font-bold uppercase tracking-wide" style={{ color: 'var(--pos)' }}>
            ✓ {title}
          </span>
          <span className="text-[10px] px-1.5 py-0.5 rounded-full font-bold"
                style={{ background: 'var(--pos)', color: '#fff' }}>{items.length}</span>
        </div>
        <span className="text-[10px]" style={{ color: 'var(--muted)' }}>{open ? '▲' : '▼'}</span>
      </button>

      {open && (
        <div className="px-2 pb-2 pt-2" style={{ borderTop: '1px solid var(--line)' }}>
          {items.map(item => (
            <AmalAccordion
              key={item.amal.id}
              item={item}
              isDone={true}
              expanded={!!expandedAmals[item.amal.id]}
              onToggleExpand={onToggleExpand}
              onClickAmal={() => onEdit(item.amal, item.periodeKey)}
              chartData={chartDataByAmal[item.amal.id] || []}
              onOpenFull={() => onOpenFull({ mode: 'single', amalId: item.amal.id })}
            />
          ))}
        </div>
      )}
    </div>
  );
}
