<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kompas — Pemantau Arah Hidup</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d0d1a;color:#e0e0e0;min-height:100vh}

.app-header{padding:20px;text-align:center}
.app-header h1{font-size:24px;color:#fff}
.app-header p{color:#888;font-size:14px}

.amal-list{padding:0 16px;max-width:500px;margin:0 auto}
.amal-item{background:#1a1a2e;border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .2s}
.amal-item:active{transform:scale(.98)}
.amal-icon{width:48px;height:48px;background:#7c7cf0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.amal-icon.done{background:#4caf50}
.amal-info{flex:1}
.amal-info h3{color:#fff;font-size:16px}
.amal-info p{color:#888;font-size:13px;margin-top:2px}
.amal-check{width:28px;height:28px;border:2px solid #555;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.amal-check.done{background:#4caf50;border-color:#4caf50}

/* ===== POPUP - dijauhkan dari bawah ===== */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:1000;padding-bottom:90px}

.popup{background:#16162a;border-radius:24px 24px 0 0;width:100%;max-width:500px;max-height:calc(100vh - 110px);overflow-y:auto;padding:24px;padding-bottom:40px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

.popup-header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.popup-icon{width:56px;height:56px;background:#7c7cf0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.popup-icon.done{background:#4caf50}
.popup-title-section{flex:1}
.popup-title-section h2{color:#fff;font-size:22px}
.popup-title-section p{color:#888;font-size:14px;margin-top:2px}
.popup-close{width:44px;height:44px;background:#2a2a4a;border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.progress-check-label{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#1e1e36;border-radius:12px;margin-bottom:20px;cursor:pointer}
.progress-check-label input[type=checkbox]{width:22px;height:22px;accent-color:#4caf50}
.progress-check-label span{color:#fff;font-size:15px}

.section-title{color:#7c7cf0;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.section-label{color:#aaa;font-size:15px;margin-bottom:10px}

/* ===== NOTES SECTION ===== */
.notes-section{margin-bottom:24px}

.notes-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.note-chip{background:#2a2a4a;border:1px solid #3a3a5a;border-radius:20px;padding:6px 14px;font-size:13px;color:#ccc;cursor:pointer;transition:all .2s;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-chip:hover{background:#3a3a5a}
.note-chip.active{background:#7c7cf0;border-color:#7c7cf0;color:#fff}

.btn-add-note{background:transparent;border:1px dashed #555;border-radius:20px;padding:6px 14px;font-size:13px;color:#aaa;cursor:pointer;margin-bottom:12px;transition:all .2s}
.btn-add-note:hover{border-color:#7c7cf0;color:#7c7cf0}

.note-title-input{width:100%;background:#1e1e36;border:1px solid #2a2a4a;border-radius:12px;padding:12px 14px;color:#fff;font-size:15px;margin-bottom:10px;outline:none}
.note-title-input:focus{border-color:#7c7cf0}
.note-title-input::placeholder{color:#666}

.note-textarea{width:100%;background:#1e1e36;border:1px solid #2a2a4a;border-radius:12px;padding:14px;color:#fff;font-size:15px;min-height:120px;resize:vertical;outline:none;font-family:inherit}
.note-textarea:focus{border-color:#7c7cf0}
.note-textarea::placeholder{color:#666}

.note-actions{display:flex;gap:10px;margin-top:12px}
.btn-save{flex:1;background:#7c7cf0;border:none;border-radius:12px;padding:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-save:hover{background:#6a6ae0}
.btn-delete-note{background:#ff4444;border:none;border-radius:12px;padding:12px 20px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn-delete-note:hover{background:#cc0000}

.bonus-section{margin-bottom:24px}
.bonus-note-display{background:#1e1e36;border-radius:12px;padding:14px;margin-bottom:16px;font-size:14px}
.bonus-note-display strong{color:#fff}
.bonus-note-display span{color:#888}
.bonus-input{width:100%;background:#1e1e36;border:1px solid #2a2a4a;border-radius:12px;padding:14px;color:#fff;font-size:18px;outline:none}
.bonus-input:focus{border-color:#7c7cf0}
.bonus-hint{color:#666;font-size:13px;margin-top:8px;line-height:1.5}

.popup-footer{display:flex;gap:12px;margin-top:20px}
.btn-back{flex:1;background:#2a2a4a;border:none;border-radius:12px;padding:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn-primary-footer{flex:1;background:#7c7cf0;border:none;border-radius:12px;padding:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}

/* ===== CONFIRM DIALOG ===== */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px}
.confirm-dialog{background:#1e1e36;border-radius:20px;padding:24px;max-width:360px;width:100%}
.confirm-dialog h3{color:#fff;font-size:18px;margin-bottom:12px}
.confirm-dialog p{color:#aaa;font-size:14px;margin-bottom:20px;line-height:1.5}
.confirm-actions{display:flex;gap:10px;flex-wrap:wrap}
.confirm-actions button{flex:1;min-width:100px;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn-c-secondary{background:#2a2a4a;color:#fff}
.btn-c-primary{background:#7c7cf0;color:#fff}
.btn-c-tertiary{background:#4caf50;color:#fff}
.btn-c-danger{background:#ff4444;color:#fff}

.popup::-webkit-scrollbar{width:4px}
.popup::-webkit-scrollbar-track{background:transparent}
.popup::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
</style>
</head>
<body>

<div class="app-header">
  <h1>Kompas</h1>
  <p>Pemantau Arah Hidup</p>
</div>

<div class="amal-list" id="amal-list"></div>

<!-- ===== POPUP ===== -->
<div id="popup-overlay" class="popup-overlay" style="display:none" onclick="if(event.target===this)closePopup()">
  <div class="popup">
    <div class="popup-header">
      <div class="popup-icon" id="popup-icon">✓</div>
      <div class="popup-title-section">
        <h2 id="popup-title">Olah raga</h2>
        <p id="popup-subtitle">Wajib · 1 poin · harian</p>
      </div>
      <button class="popup-close" onclick="closePopup()">✕</button>
    </div>

    <label class="progress-check-label">
      <input type="checkbox" id="progress-check">
      <span>Tandai selesai hari ini</span>
    </label>

    <!-- NOTES -->
    <div class="notes-section">
      <div class="section-label">Catatan (opsional)</div>

      <div id="notes-list" class="notes-list" style="display:none"></div>

      <button id="btn-add-note" class="btn-add-note" style="display:none" onclick="addNewNote()">+ Tambah Catatan</button>

      <input type="text" id="note-title" placeholder="Judul catatan..." class="note-title-input">
      <textarea id="note-content" placeholder="Catatan, rencana, atau apapun yang ingin kamu tulis..." class="note-textarea"></textarea>

      <div class="note-actions">
        <button id="btn-delete-note" class="btn-delete-note" style="display:none" onclick="confirmDeleteNote()">Hapus</button>
        <button id="btn-save-note" class="btn-save" onclick="confirmSaveNote()">Simpan</button>
      </div>
    </div>

    <!-- BONUS -->
    <div class="bonus-section">
      <div class="section-title">Tambahkan Bonus Pahala</div>
      <div class="bonus-note-display">
        <strong>Catatan:</strong> <span id="bonus-note-text">-</span>
      </div>
      <div class="section-label">Bonus Pahala (opsional)</div>
      <input type="number" id="bonus-input" placeholder="0" class="bonus-input">
      <p class="bonus-hint">Misal +5 karena amal istimewa, atau −5 karena kurang sempurna. Kosongkan untuk 0.</p>
    </div>

    <div class="popup-footer">
      <button class="btn-back" onclick="closePopup()">Kembali</button>
      <button class="btn-primary-footer" onclick="saveProgress()">Simpan Progres</button>
    </div>
  </div>
</div>

<!-- ===== CONFIRM DIALOG ===== -->
<div id="confirm-overlay" class="confirm-overlay" style="display:none">
  <div class="confirm-dialog">
    <h3 id="confirm-title">Konfirmasi</h3>
    <p id="confirm-message">Pesan</p>
    <div class="confirm-actions" id="confirm-actions"></div>
  </div>
</div>

<script>
// ============ DATA ============
const DEFAULT_AMALS = [
  { id:'olahraga', name:'Olah raga', type:'Wajib', points:1, frequency:'harian', icon:'✓' }
];

let currentAmal = null;
let currentNoteIndex = -1; // -1 = mode catatan baru
const today = new Date().toISOString().split('T')[0];

function getData(){ try{return JSON.parse(localStorage.getItem('kompas_data')||'{}')}catch{return{}} }
function saveData(d){ localStorage.setItem('kompas_data',JSON.stringify(d)) }
function getDayData(date,amalId){ const d=getData(); return d[date]?.[amalId]||{checked:false,bonus:0,notes:[]} }
function setDayData(date,amalId,dd){ const d=getData(); if(!d[date])d[date]={}; d[date][amalId]=dd; saveData(d) }

// ============ RENDER LIST ============
function renderAmalList(){
  const list=document.getElementById('amal-list');
  list.innerHTML='';
  DEFAULT_AMALS.forEach(amal=>{
    const dd=getDayData(today,amal.id);
    const el=document.createElement('div');
    el.className='amal-item';
    el.onclick=()=>openPopup(amal);
    el.innerHTML=`
      <div class="amal-icon ${dd.checked?'done':''}">${amal.icon}</div>
      <div class="amal-info"><h3>${amal.name}</h3><p>${amal.type} · ${amal.points} poin · ${amal.frequency}</p></div>
      <div class="amal-check ${dd.checked?'done':''}">${dd.checked?'✓':''}</div>`;
    list.appendChild(el);
  });
}

// ============ POPUP ============
function openPopup(amal){
  currentAmal=amal;
  currentNoteIndex=-1;
  const dd=getDayData(today,amal.id);

  document.getElementById('popup-title').textContent=amal.name;
  document.getElementById('popup-subtitle').textContent=`${amal.type} · ${amal.points} poin · ${amal.frequency}`;
  const iconEl=document.getElementById('popup-icon');
  iconEl.textContent=amal.icon;
  iconEl.className='popup-icon'+(dd.checked?' done':'');
  document.getElementById('progress-check').checked=dd.checked;
  document.getElementById('bonus-input').value=dd.bonus||'';

  renderNotes(dd.notes||[]);
  document.getElementById('popup-overlay').style.display='flex';
  document.body.style.overflow='hidden';
}

function closePopup(){
  document.getElementById('popup-overlay').style.display='none';
  document.body.style.overflow='';
  currentAmal=null;
  currentNoteIndex=-1;
  renderAmalList();
}

// ============ NOTES RENDER ============
function renderNotes(notes){
  const listEl=document.getElementById('notes-list');
  const addBtn=document.getElementById('btn-add-note');
  const saveBtn=document.getElementById('btn-save-note');
  const delBtn=document.getElementById('btn-delete-note');
  const titleIn=document.getElementById('note-title');
  const contentIn=document.getElementById('note-content');

  updateBonusNoteDisplay(notes);

  if(notes.length===0){
    // TIDAK ADA CATATAN
    listEl.style.display='none';
    addBtn.style.display='none';
    delBtn.style.display='none';
    saveBtn.textContent='Simpan';
    titleIn.value='';
    contentIn.value='';
    currentNoteIndex=-1;

  } else if(notes.length===1){
    // SATU CATATAN -> langsung masuk form, tombol "Ubah"
    listEl.style.display='none';
    addBtn.style.display='inline-block';
    delBtn.style.display='inline-block';
    saveBtn.textContent='Ubah';
    titleIn.value=notes[0].title||'';
    contentIn.value=notes[0].content||'';
    currentNoteIndex=0;

  } else {
    // LEBIH DARI 1 -> tampilkan daftar chip, form kosong
    listEl.style.display='flex';
    addBtn.style.display='inline-block';
    listEl.innerHTML='';
    notes.forEach((note,idx)=>{
      const chip=document.createElement('button');
      chip.className='note-chip';
      chip.textContent=note.title||'Tanpa judul';
      chip.onclick=()=>selectNote(idx);
      listEl.appendChild(chip);
    });
    delBtn.style.display='none';
    saveBtn.textContent='Simpan';
    titleIn.value='';
    contentIn.value='';
    currentNoteIndex=-1;
  }
}

function selectNote(idx){
  const dd=getDayData(today,currentAmal.id);
  const notes=dd.notes||[];
  const note=notes[idx];

  currentNoteIndex=idx;
  document.getElementById('note-title').value=note.title||'';
  document.getElementById('note-content').value=note.content||'';
  document.getElementById('btn-save-note').textContent='Ubah';
  document.getElementById('btn-delete-note').style.display='inline-block';

  document.querySelectorAll('.note-chip').forEach((c,i)=>c.classList.toggle('active',i===idx));
}

function addNewNote(){
  currentNoteIndex=-1;
  document.getElementById('note-title').value='';
  document.getElementById('note-content').value='';
  document.getElementById('btn-save-note').textContent='Simpan';
  document.getElementById('btn-delete-note').style.display='none';
  document.querySelectorAll('.note-chip').forEach(c=>c.classList.remove('active'));
  document.getElementById('note-title').focus();
}

function updateBonusNoteDisplay(notes){
  const txt=notes&&notes.length>0 ? notes.map(n=>n.title||'Tanpa judul').join(', ') : '-';
  document.getElementById('bonus-note-text').textContent=txt;
}

// ============ CONFIRM DIALOG ============
function showConfirm(opts){
  document.getElementById('confirm-title').textContent=opts.title||'Konfirmasi';
  document.getElementById('confirm-message').textContent=opts.message||'';
  const acts=document.getElementById('confirm-actions');
  acts.innerHTML='';
  (opts.buttons||[]).forEach(b=>{
    const btn=document.createElement('button');
    btn.textContent=b.text;
    btn.className=b.className||'btn-c-primary';
    btn.onclick=()=>{document.getElementById('confirm-overlay').style.display='none'; if(b.action)b.action()};
    acts.appendChild(btn);
  });
  document.getElementById('confirm-overlay').style.display='flex';
}

// ============ SAVE NOTE ============
function confirmSaveNote(){
  const title=document.getElementById('note-title').value.trim();
  const content=document.getElementById('note-content').value.trim();

  if(!title&&!content){
    showConfirm({title:'Catatan Kosong',message:'Tulis judul atau isi catatan dulu.',
      buttons:[{text:'OK',className:'btn-c-primary'}]});
    return;
  }

  const dd=getDayData(today,currentAmal.id);
  const notes=dd.notes||[];

  if(currentNoteIndex===-1){
    // MODE CATATAN BARU -> langsung simpan sebagai baru
    showConfirm({
      title:'Simpan Catatan Baru',
      message:`Simpan catatan "${title||'Tanpa judul'}"?`,
      buttons:[
        {text:'Batal',className:'btn-c-secondary'},
        {text:'Simpan',className:'btn-c-primary',action:()=>doSaveNote(title,content,-1)}
      ]
    });
  } else {
    // MODE EDIT -> 2 pilihan
    showConfirm({
      title:'Simpan Perubahan',
      message:`Catatan "${notes[currentNoteIndex].title||'Tanpa judul'}" sedang diedit. Mau disimpan ke mana?`,
      buttons:[
        {text:'Batal',className:'btn-c-secondary'},
        {text:'Edit Langsung',className:'btn-c-primary',action:()=>doSaveNote(title,content,currentNoteIndex)},
        {text:'Catatan Baru',className:'btn-c-tertiary',action:()=>doSaveNote(title,content,-1)}
      ]
    });
  }
}

function doSaveNote(title,content,index){
  const dd=getDayData(today,currentAmal.id);
  let notes=dd.notes||[];

  if(index===-1){
    notes.push({id:'note_'+Date.now(),title,content});
  } else {
    notes[index]={...notes[index],title,content};
  }

  dd.notes=notes;
  setDayData(today,currentAmal.id,dd);

  if(index===-1) currentNoteIndex=notes.length-1;
  renderNotes(notes);

  showConfirm({title:'✓ Tersimpan',message:'Catatan berhasil disimpan.',
    buttons:[{text:'OK',className:'btn-c-primary'}]});
}

// ============ DELETE NOTE ============
function confirmDeleteNote(){
  const dd=getDayData(today,currentAmal.id);
  const notes=dd.notes||[];
  const note=notes[currentNoteIndex];

  showConfirm({
    title:'Hapus Catatan',
    message:`Hapus catatan "${note?.title||'Tanpa judul'}"? Tindakan ini tidak bisa dibatalkan.`,
    buttons:[
      {text:'Batal',className:'btn-c-secondary'},
      {text:'Hapus',className:'btn-c-danger',action:()=>{
        notes.splice(currentNoteIndex,1);
        dd.notes=notes;
        setDayData(today,currentAmal.id,dd);
        currentNoteIndex=-1;
        renderNotes(notes);
      }}
    ]
  });
}

// ============ SAVE PROGRESS ============
function saveProgress(){
  const dd=getDayData(today,currentAmal.id);
  dd.checked=document.getElementById('progress-check').checked;
  dd.bonus=parseInt(document.getElementById('bonus-input').value)||0;
  setDayData(today,currentAmal.id,dd);
  closePopup();
}

// ============ INIT ============
renderAmalList();
</script>
</body>
</html>
