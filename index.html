   KONSTANTA
   ============================================================ */
const LS_AMAL = 'kompas-amal-v1';
const LS_RECORDS = 'kompas-records-v1';
const LS_CHECKS_OLD = 'kompas-checks-v1';

const SIFAT_INFO = {
  wajib:  { label: 'Wajib',  color: 'var(--wajib)',  icon: '✅', desc: 'Dikerjakan +N · Ditinggal −N' },
  sunah:  { label: 'Sunah',  color: 'var(--sunah)',  icon: '🌱', desc: 'Dikerjakan +N · Ditinggal 0' },
  makruh: { label: 'Makruh', color: 'var(--makruh)', icon: '⚠️', desc: 'Dikerjakan 0 · Ditinggal +N' },
  haram:  { label: 'Haram',  color: 'var(--haram)',  icon: '🚫', desc: 'Dikerjakan −N · Ditinggal +N' },
};

const BULAN_PENDEK = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI_PENDEK = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

/* ============================================================
   STORAGE
   ============================================================ */
function loadLS(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch { return def; }
}
function saveLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

/* ============================================================
   DATE
   ============================================================ */
function startOfDay(d) { const n = new Date(d); n.setHours(0,0,0,0); return n; }
function toKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fromKey(k) {
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatDateShort(d) { return d.getDate() + ' ' + BULAN_PENDEK[d.getMonth()]; }
function formatDateFull(d) {
  return HARI_PENDEK[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN_PENDEK[d.getMonth()] + ' ' + d.getFullYear();
}

/* ============================================================
   SCORE (dengan bonus)
   ============================================================ */
function computeScore(sifat, nilai, checked, bonus = 0) {
  let base;
  if (sifat === 'wajib')  base = checked ? nilai : -nilai;
  else if (sifat === 'sunah')  base = checked ? nilai : 0;
  else if (sifat === 'makruh') base = checked ? 0 : nilai;
  else if (sifat === 'haram')  base = checked ? -nilai : nilai;
  else base = 0;
  return base + (checked ? (Number(bonus) || 0) : 0);
}

/* ============================================================
   PERIOD
   ============================================================ */
function getCurrentPeriodKey(amal, refDate = new Date()) {
  const d = startOfDay(refDate);
  if (amal.periode === 'harian') return toKey(d);
  if (amal.periode === 'mingguan') {
    const sun = new Date(d); sun.setDate(sun.getDate() - sun.getDay());
    return toKey(sun);
  }
  if (amal.periode === 'bulanan') return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  if (amal.periode === 'tahunan') return String(d.getFullYear());
  return toKey(d);
}

function getDeadlineDate(amal, periodKey) {
  if (amal.periode === 'harian') {
    const [y,m,d] = periodKey.split('-').map(Number);
    return new Date(y, m-1, d, 23, 59, 59);
  }
  if (amal.periode === 'mingguan') {
    const [y,m,d] = periodKey.split('-').map(Number);
    const sun = new Date(y, m-1, d);
    const dd = amal.deadlineDay ?? 6;
    const dl = new Date(sun); dl.setDate(dl.getDate() + dd);
    dl.setHours(23, 55, 0);
    return dl;
  }
  if (amal.periode === 'bulanan') {
    const [y,m] = periodKey.split('-').map(Number);
    const last = new Date(y, m, 0).getDate();
    const dd = Math.min(amal.deadlineDate ?? 28, last);
    return new Date(y, m-1, dd, 23, 55, 0);
  }
  if (amal.periode === 'tahunan') {
    const y = Number(periodKey);
    const m = amal.deadlineMonth ?? 12;
    const d = amal.deadlineDate ?? 31;
    return new Date(y, m-1, d, 23, 55, 0);
  }
  return new Date();
}

function getAllPeriodKeys(amal, untilDate = new Date()) {
  const keys = [];
  const start = startOfDay(new Date(amal.createdAt));
  const end = startOfDay(untilDate);
  if (start > end) return keys;
  if (amal.periode === 'harian') {
    for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) keys.push(toKey(d));
  } else if (amal.periode === 'mingguan') {
    const sun = new Date(start); sun.setDate(sun.getDate() - sun.getDay());
    for (let d = new Date(sun); d <= end; d.setDate(d.getDate()+7)) keys.push(toKey(d));
  } else if (amal.periode === 'bulanan') {
    let y = start.getFullYear(), m = start.getMonth();
    while (new Date(y, m, 1) <= end) {
      keys.push(y + '-' + String(m+1).padStart(2,'0'));
      m++; if (m > 11) { m = 0; y++; }
    }
  } else if (amal.periode === 'tahunan') {
    for (let y = start.getFullYear(); y <= end.getFullYear(); y++) keys.push(String(y));
  }
  return keys;
}

function computeEntries(amalList, records, now = new Date()) {
  const entries = [];
  amalList.forEach(amal => {
    const keys = getAllPeriodKeys(amal, now);
    keys.forEach(pk => {
      const record = records[amal.id]?.[pk];
      const checked = !!record?.checked;
      const bonus = record?.bonus || 0;
      const deadline = getDeadlineDate(amal, pk);
      const nilai = computeScore(amal.sifat, amal.nilai, checked, bonus);
      entries.push({
        amalId: amal.id,
        periodeKey: pk,
        tanggalApply: toKey(startOfDay(deadline)),
        deadline,
        checked,
        bonus,
        catatan: record?.catatan || '',
        nilai,
        sifat: amal.sifat,
        nama: amal.nama,
      });
    });
  });
  return entries.sort((a,b) => a.deadline - b.deadline);
}

function groupDeltasByDate(entries, limitKey) {
  const map = {};
  entries.forEach(e => {
    if (limitKey && e.tanggalApply > limitKey) return;
    map[e.tanggalApply] = (map[e.tanggalApply] || 0) + e.nilai;
  });
  return map;
}

/* ============================================================
   KOMPONEN: GRAFIK
   ============================================================ */
function ArahChart({ data, height = 180 }) {
  if (!data || data.length < 2) {
    return (
      <div className="flex items-center justify-center text-xs text-center px-4"
           style={{ color: 'var(--muted)', height }}>
        Belum cukup data untuk grafik.
      </div>
    );
  }
  if (data.every(d => d.cumScore === 0)) {
    return (
      <div className="flex items-center justify-center text-xs text-center px-4"
           style={{ color: 'var(--muted)', height }}>
        Belum ada aktivitas pada periode ini.
      </div>
    );
  }

  const w = 500, hh = height, pad = { l: 36, r: 12, t: 12, b: 24 };
  const innerW = w - pad.l - pad.r;
  const innerH = hh - pad.t - pad.b;
  const minY = Math.min(0, ...data.map(d => d.cumScore));
  const maxY = Math.max(0, ...data.map(d => d.cumScore));
  const rangeY = (maxY - minY) || 1;
  const points = data.map((d, i) => {
    const x = pad.l + (i / (data.length - 1)) * innerW;
    const y = pad.t + innerH - ((d.cumScore - minY) / rangeY) * innerH;
    return { x, y, d };
  });
  const lineD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaD = lineD + ' L' + points[points.length-1].x.toFixed(1) + ',' + (pad.t + innerH) + ' L' + points[0].x.toFixed(1) + ',' + (pad.t + innerH) + ' Z';
  const last = points[points.length-1];
  const zeroY = pad.t + innerH - ((0 - minY) / rangeY) * innerH;
  const isPositive = data[data.length-1].cumScore >= data[0].cumScore;
  const lineColor = isPositive ? 'var(--pos)' : 'var(--neg)';
  const labelAt = (d) => d.label || formatDateShort(fromKey(d.date));
  const showAllLabels = data.length <= 12;

  return (
    <svg viewBox={`0 0 ${w} ${hh}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
      {minY < 0 && maxY > 0 && (
        <line x1={pad.l} y1={zeroY} x2={w - pad.r} y2={zeroY}
              stroke="var(--line)" strokeDasharray="3 3" />
      )}
      <defs>
        <linearGradient id="gradArah" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={lineColor} stopOpacity="0.3" />
          <stop offset="100%" stopColor={lineColor} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={areaD} fill="url(#gradArah)" />
      <path d={lineD} fill="none" stroke={lineColor} strokeWidth="2.5"
            strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={last.x} cy={last.y} r="4" fill={lineColor} />
      <circle cx={last.x} cy={last.y} r="7" fill={lineColor} opacity="0.2" />
      <text x={pad.l - 4} y={pad.t + 8} textAnchor="end" fontSize="9" fill="var(--muted)">{maxY}</text>
      {minY < 0 && (
        <text x={pad.l - 4} y={pad.t + innerH} textAnchor="end" fontSize="9" fill="var(--muted)">{minY}</text>
      )}
      {showAllLabels ? (
        points.map((p, i) => (
          <text key={i} x={p.x} y={hh - 6}
                textAnchor={i === 0 ? 'start' : i === points.length-1 ? 'end' : 'middle'}
                fontSize="8" fill="var(--muted)">{labelAt(p.d)}</text>
        ))
      ) : (
        <>
          <text x={pad.l} y={hh - 6} textAnchor="start" fontSize="9" fill="var(--muted)">{labelAt(data[0])}</text>
          <text x={w - pad.r} y={hh - 6} textAnchor="end" fontSize="9" fill="var(--muted)">{labelAt(data[data.length-1])}</text>
        </>
      )}
    </svg>
  );
}

          className="w-full px-3 py-2.5 rounded-xl text-sm mb-3"

                </button>
              ))}
            </div>
          </div>
        )}

        {periode === 'bulanan' && (
          <div>
            <label className="block text-xs font-semibold mb-1.5" style={{ color: 'var(--muted)' }}>Deadline (tanggal)</label>
            <input
              type="number" min="1" max="31" value={deadlineDate}

              className="w-full px-3 py-2.5 rounded-xl text-sm mb-3"
              style={{ background: 'var(--soft)', color: 'var(--text)', border: '1px solid var(--line)' }} />
          </div>
        )}

        {periode === 'tahunan' && (
          <div>
            <label className="block text-xs font-semibold mb-1.5" style={{ color: 'var(--muted)' }}>Deadline (bulan & tanggal)</label>
            <div className="grid grid-cols-2 gap-2 mb-3">
              <input
                type="number" min="1" max="12" value={deadlineMonth}
                onChange={e => setDeadlineMonth(e.target.value)}
                placeholder="Bulan"
                className="w-full px-3 py-2.5 rounded-xl text-sm"
                style={{ background: 'var(--soft)', color: 'var(--text)', border: '1px solid var(--line)' }} />
              <input
                type="number" min="1" max="31" value={deadlineDate}
                onChange={e => setDeadlineDate(e.target.value)}
                placeholder="Tanggal"
                className="w-full px-3 py-2.5 rounded-xl text-sm"
                style={{ background: 'var(--soft)', color: 'var(--text)', border: '1px solid var(--line)' }} />
            </div>
          </div>
        )}

        <div className="flex gap-2 mt-2">
          <button onClick={submit}
                  className="flex-1 py-3 rounded-xl text-sm font-bold active:scale-[.98] transition"
                  style={{ background: 'var(--accent)', color: 'var(--accent-text)' }}>
            Simpan
          </button>
          <button onClick={onCancel}
                  className="px-4 py-3 rounded-xl text-sm font-medium active:scale-[.98] transition"
                  style={{ background: 'var(--soft)', color: 'var(--text)' }}>
            Batal
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   KOMPONEN: POPUP AMAL (konfirmasi / bonus / edit done)
   ============================================================ */
function AmalPopup({ amal, periodeKey, record, onSave, onSaveNotes, onUncheck, onClose }) {
  const isDone = !!record?.checked;
  const [step, setStep] = useState(isDone ? 'edit' : 'konfirmasi');
  const legacyNotes = record?.catatan?.trim()
    ? [{ id: 'legacy-' + amal.id + '-' + periodeKey, title: 'Catatan lama', content: record.catatan }]
    : [];
  const notes = Array.isArray(record?.catatanItems) ? record.catatanItems : legacyNotes;
  const [noteListOpen, setNoteListOpen] = useState(false);
  const [selectedNoteId, setSelectedNoteId] = useState(
    notes.length === 1 ? notes[0].id : null
  );
  const selectedNote = notes.find(n => n.id === selectedNoteId) || null;
  const [catatan, setCatatan] = useState(notes.length === 1 ? notes[0].content : '');
  const [judul, setJudul] = useState(notes.length === 1 ? notes[0].title : '');
  const [bonus, setBonus] = useState(record?.bonus ? String(record.bonus) : '');
  const [confirmOpen, setConfirmOpen] = useState(false);

  const info = SIFAT_INFO[amal.sifat];
  const updateDraft = (note) => {
    setSelectedNoteId(note?.id || null);
    setCatatan(note?.content || '');
    setJudul(note?.title || '');
    setNoteListOpen(false);
  };
  const saveNote = (asNew = false) => {
    const content = catatan.trim();
    const title = judul.trim() || (content ? content.split('\n')[0].slice(0, 36) : 'Catatan tanpa judul');
    let nextNotes;
    if (selectedNoteId && !asNew) {
      nextNotes = notes.map(n => n.id === selectedNoteId ? { ...n, title, content } : n);
    } else {
      nextNotes = [...notes, { id: 'note-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), title, content }];
    }
    onSaveNotes(nextNotes);
  };
  const getNotesWithDraft = () => {
    if (!selectedNoteId && !catatan.trim() && !judul.trim()) return notes;
    const content = catatan.trim();
    const title = judul.trim() || (content ? content.split('\n')[0].slice(0, 36) : 'Catatan tanpa judul');
    if (selectedNoteId) {
      return notes.map(n => n.id === selectedNoteId ? { ...n, title, content } : n);
    }
    if (!content && !judul.trim()) return notes;
    return [...notes, { id: 'note-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), title, content }];
  };
  const handleNoteSaveClick = () => {
    if (!catatan.trim() && !judul.trim()) {
      alert('Tulis judul atau isi catatan terlebih dahulu.');
      return;
    }
    if (notes.length === 0) {
      saveNote(false);
    } else {
      setConfirmOpen(true);
    }
  };
  const deleteSelectedNote = () => {
    if (!selectedNoteId) return;
    if (!window.confirm('Hapus catatan ini?')) return;
    const nextNotes = notes.filter(n => n.id !== selectedNoteId);
    onSaveNotes(nextNotes);
    updateDraft(null);
  };

  const frame = (children) => (
    <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center"
         style={{
           background: 'rgba(0,0,0,.5)', backdropFilter: 'blur(3px)',
           paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 48px)',
           paddingLeft: '12px', paddingRight: '12px',
         }}
         onClick={onClose}>
      <div
        className="w-full sm:max-w-md rounded-3xl p-5 max-h-[82vh] overflow-y-auto"
        style={{ background: 'var(--card)', color: 'var(--text)' }}
        onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg flex items-center justify-center text-sm"
                 style={{ background: info.color, color: '#fff' }}>{info.icon}</div>
            <div>
              <div className="text-base font-bold leading-tight">{amal.nama}</div>
              <div className="text-[10px]" style={{ color: 'var(--muted)' }}>
                {info.label} · {amal.nilai} poin · {amal.periode}
              </div>
            </div>
          </div>
          <button onClick={onClose}
                  className="w-8 h-8 rounded-full flex items-center justify-center"
                  style={{ background: 'var(--soft)', color: 'var(--muted)' }}>✕</button>
        </div>
        {children}
        {confirmOpen && (
          <div className="fixed inset-0 z-[80] flex items-center justify-center p-4"
               style={{ background: 'rgba(0,0,0,.58)' }}
               onClick={() => setConfirmOpen(false)}>
            <div className="w-full max-w-sm rounded-2xl p-4"
                 style={{ background: 'var(--card)', color: 'var(--text)' }}
                 onClick={e => e.stopPropagation()}>
              <div className="font-bold text-sm mb-1">Simpan catatan?</div>
              <div className="text-xs mb-4" style={{ color: 'var(--muted)' }}>
                {selectedNoteId
                  ? 'Pilih apakah catatan ini diperbarui atau disimpan sebagai catatan terpisah.'
                  : 'Catatan ini akan ditambahkan sebagai catatan terpisah.'}
              </div>
              <div className="grid gap-2">
                {selectedNoteId && (

/* ============================================================
   KOMPONEN: TAB BERANDA
   ============================================================ */
function TabBeranda({ amalList, records, simDate, onOpenAmal, onEditAmal, onOpenFullData }) {
  const [expandedAmals, setExpandedAmals] = useState({});
  const [expandedDone, setExpandedDone] = useState({});
  const todayKey = toKey(simDate);

  const grouped = useMemo(() => {
    const result = { harian: [], mingguan: [], bulanan: [], tahunan: [] };
    amalList.forEach(amal => {
      const key = getPeriodKey(amal, simDate);
      const record = records[amal.id + '_' + key];
      const item = { amal, record, key };
      if (record?.checked) {
        result[amal.periode].push(item);
      } else {
        result[amal.periode].push(item);
      }
    });
    return result;
  }, [amalList, records, simDate]);

  const pendingByPeriod = useMemo(() => {
    const result = { harian: [], mingguan: [], bulanan: [], tahunan: [] };
    Object.keys(grouped).forEach(period => {
      result[period] = grouped[period].filter(item => !item.record?.checked);
    });
    return result;
  }, [grouped]);

  const doneByPeriod = useMemo(() => {
    const result = { harian: [], mingguan: [], bulanan: [], tahunan: [] };
    Object.keys(grouped).forEach(period => {
      result[period] = grouped[period].filter(item => item.record?.checked);
    });
    return result;
  }, [grouped]);

  const chartDataByAmal = useMemo(() => {
    const output = {};
    amalList.forEach(amal => {
      const entries = computeEntries([amal], records, simDate);
      const deltas = groupDeltasByDate(entries, todayKey);
      const points = [];
      let cumulative = 0;
      const start = new Date(simDate);
      start.setDate(start.getDate() - 29);
      start.setHours(0, 0, 0, 0);

      const allDeltas = Object.keys(deltas).sort();
      allDeltas.forEach(k => {
        if (fromKey(k) < start) cumulative += deltas[k];
      });

      for (let i = 0; i < 30; i++) {
        const d = new Date(start);
        d.setDate(d.getDate() + i);
        const k = toKey(d);
        const delta = deltas[k] || 0;
        cumulative += delta;
        points.push({ date: k, cumScore: cumulative, delta });
      }
      output[amal.id] = points;
    });
    return output;
  }, [amalList, records, simDate, todayKey]);

  const toggleAmal = id => setExpandedAmals(prev => ({ ...prev, [id]: !prev[id] }));
  const toggleDone = period => setExpandedDone(prev => ({ ...prev, [period]: !prev[period] }));

  const periodLabels = {
    harian: 'Harian',
    mingguan: 'Mingguan',
    bulanan: 'Bulanan',
    tahunan: 'Tahunan',
  };

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 gap-2">
        {Object.keys(periodLabels).map(period => (
          <div key={period} className="rounded-2xl p-3"
               style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
            <div className="text-[10px] uppercase font-semibold" style={{ color: 'var(--muted)' }}>
              {periodLabels[period]}
            </div>
            <div className="text-xl font-bold">{pendingByPeriod[period].length}</div>
            <div className="text-[10px]" style={{ color: 'var(--muted)' }}>Belum dikerjakan</div>
          </div>
        ))}
      </div>

      {Object.keys(periodLabels).map(period => (
        <div key={period}>
          <div className="flex items-center justify-between mb-2">
            <div className="text-sm font-bold">{periodLabels[period]}</div>
            <div className="text-[10px]" style={{ color: 'var(--muted)' }}>
              {pendingByPeriod[period].length} belum · {doneByPeriod[period].length} selesai
            </div>
          </div>
          {pendingByPeriod[period].map(item => (
            <AmalAccordion
              key={item.amal.id}
              item={item}
              expanded={!!expandedAmals[item.amal.id]}
              onToggleExpand={toggleAmal}
              onClickAmal={() => onOpenAmal(item)}
              chartData={chartDataByAmal[item.amal.id] || []}
              onOpenFull={() => onOpenFullData(item.amal.id)}
            />
          ))}
          {doneByPeriod[period].length > 0 && (
            <DoneAccordion
              title={'Sudah Dikerjakan · ' + periodLabels[period]}
              items={doneByPeriod[period]}
              expanded={!!expandedDone[period]}
              onToggle={() => toggleDone(period)}
              expandedAmals={expandedAmals}
              onToggleExpand={toggleAmal}
              chartDataByAmal={chartDataByAmal}
              onEdit={onEditAmal}
              onOpenFull={onOpenFullData}
            />
          )}
        </div>
      ))}
    </div>
  );
}

      if (step === 'belum') {
    return frame(

        <div className="text-sm font-semibold text-center py-2">Progres tidak dicentang.</div>
        <div className="text-xs text-center mb-3" style={{ color: 'var(--muted)' }}>

      <div className="text-[10px] mb-3" style={{ color: 'var(--muted)' }}>

        <button onClick={() => setStep('konfirmasi')} className="flex-1 py-3 rounded-xl text-sm font-semibold"
                style={{ background: 'var(--soft)', color: 'var(--text)' }}>Kembali</button>
        <button onClick={() => onSave({ checked: true, catatan: catatan.trim(), catatanItems: getNotesWithDraft(), bonus: Number(bonus) || 0 })}

/* ============================================================
   KOMPONEN: FULL DATA VIEW
   ============================================================ */
function FullDataView({ mode, amalId, allAmal, records, simDate, onClose }) {
  const [periodType, setPeriodType] = useState('bulan');
  const [offset, setOffset] = useState(0);

  const amalList = useMemo(() => {
    if (mode === 'all') return allAmal;
    return allAmal.filter(a => a.id === amalId);
  }, [mode, amalId, allAmal]);
  const amalObj = mode === 'single' ? allAmal.find(a => a.id === amalId) : null;

  const { points, title, subtitle } = useMemo(() => {
    const entries = computeEntries(amalList, records, simDate);
    const deltasByDate = groupDeltasByDate(entries, toKey(simDate));

    if (periodType === 'minggu') {
      const base = new Date(simDate);
      base.setDate(base.getDate() + offset * 7);
      const startSun = new Date(base);
      startSun.setDate(startSun.getDate() - startSun.getDay());
      startSun.setHours(0,0,0,0);
      const endSat = new Date(startSun);
      endSat.setDate(endSat.getDate() + 6);

      let cum = 0;
      Object.keys(deltasByDate).forEach(k => { if (k < toKey(startSun)) cum += deltasByDate[k]; });

      const pts = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(startSun); d.setDate(d.getDate() + i);
        const k = toKey(d);
        const delta = deltasByDate[k] || 0;
        cum += delta;
        pts.push({ date: k, cumScore: cum, delta });
      }
      return {
        points: pts,
        title: 'Mingguan',
        subtitle: formatDateShort(startSun) + ' – ' + formatDateShort(endSat) + ' ' + endSat.getFullYear(),
      };
    }

    if (periodType === 'bulan') {
      const monthIdx = simDate.getMonth() + offset;
      const d0 = new Date(simDate.getFullYear(), monthIdx, 1);
      const y = d0.getFullYear();
      const m = d0.getMonth();
      const daysInMonth = new Date(y, m+1, 0).getDate();

      let cum = 0;
      Object.keys(deltasByDate).forEach(k => { if (fromKey(k) < d0) cum += deltasByDate[k]; });

      const pts = [];
      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(y, m, day);
        const k = toKey(d);
        const delta = deltasByDate[k] || 0;
        cum += delta;
        pts.push({ date: k, cumScore: cum, delta });
      }
      return {
        points: pts,
        title: 'Bulanan',
        subtitle: ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][m] + ' ' + y,
      };
    }

    const y = simDate.getFullYear() + offset;
    let cum = 0;
    Object.keys(deltasByDate).forEach(k => { if (fromKey(k).getFullYear() < y) cum += deltasByDate[k]; });

    const pts = [];
    for (let m = 0; m < 12; m++) {
      const daysInMonth = new Date(y, m+1, 0).getDate();
      let monthDelta = 0;
      for (let day = 1; day <= daysInMonth; day++) {
        const k = toKey(new Date(y, m, day));
        monthDelta += deltasByDate[k] || 0;
      }
      cum += monthDelta;
      pts.push({
        date: y + '-' + String(m+1).padStart(2, '0') + '-01',
        label: BULAN_PENDEK[m],
        cumScore: cum,
        delta: monthDelta,
      });
    }
    return {
      points: pts,
      title: 'Tahunan',
      subtitle: String(y),
    };
  }, [periodType, offset, simDate, records, amalList]);



    const stats = useMemo(() => {
    const netInPeriod = points.reduce((s, p) => s + (p.delta || 0), 0);
    const lastCum = points[points.length - 1]?.cumScore || 0;
    const posCount = points.filter(p => (p.delta || 0) > 0).length;
    const negCount = points.filter(p => (p.delta || 0) < 0).length;
    return { netInPeriod, lastCum, posCount, negCount };
  }, [points]);

  return (
    <div className="fixed inset-0 z-[60] flex flex-col"
         style={{
           background: 'var(--bg)', color: 'var(--text)',
           paddingTop: 'env(safe-area-inset-top, 0px)',
           paddingBottom: 'env(safe-area-inset-bottom, 0px)',
         }}>
      <div className="flex items-center gap-3 p-4 shrink-0"
           style={{ background: 'var(--card)', borderBottom: '1px solid var(--line)' }}>
        <button onClick={onClose}
                className="w-10 h-10 rounded-full flex items-center justify-center shrink-0 active:scale-90"
                style={{ background: 'var(--soft)', color: 'var(--text)' }}>←</button>
        <div className="flex-1 min-w-0">
          <div className="text-base font-bold truncate">
            {mode === 'all' ? 'Semua Amal' : (amalObj?.nama || 'Amal')}
          </div>
          <div className="text-[11px] truncate" style={{ color: 'var(--muted)' }}>
            {mode === 'all'
              ? 'Kumulatif semua amal'
              : (amalObj ? SIFAT_INFO[amalObj.sifat].label + ' · ' + amalObj.nilai + ' poin · ' + amalObj.periode : '')}
          </div>
        </div>
      </div>

      <div className="p-3 shrink-0"
           style={{ background: 'var(--card)', borderBottom: '1px solid var(--line)' }}>
        <div className="grid grid-cols-3 gap-1 p-1 rounded-2xl" style={{ background: 'var(--soft)' }}>
          {[['minggu','Mingguan'],['bulan','Bulanan'],['tahun','Tahunan']].map(([k, l]) => (
            <button key={k} onClick={() => { setPeriodType(k); setOffset(0); }}
                    className="py-2 rounded-xl text-xs font-semibold transition active:scale-95"
                    style={{
                      background: periodType === k ? 'var(--accent)' : 'transparent',
                      color: periodType === k ? 'var(--accent-text)' : 'var(--text)',
                    }}>{l}</button>
          ))}
        </div>
      </div>

      <div className="flex items-center justify-between p-3 shrink-0"
           style={{ background: 'var(--card)', borderBottom: '1px solid var(--line)' }}>
        <button onClick={() => setOffset(o => o - 1)}
                className="w-10 h-10 rounded-full flex items-center justify-center active:scale-90"
                style={{ background: 'var(--soft)', color: 'var(--text)' }}>◀</button>
        <div className="flex-1 text-center px-2">
          <div className="text-[10px] uppercase font-semibold tracking-wide" style={{ color: 'var(--muted)' }}>{title}</div>
          <div className="text-sm font-bold truncate">{subtitle}</div>
          {offset !== 0 && (
            <div className="text-[10px] font-semibold mt-0.5" style={{ color: 'var(--accent)' }}>
              {offset > 0 ? '+' + offset + ' ke depan' : offset + ' ke belakang'}
            </div>
          )}
        </div>
        <button onClick={() => setOffset(o => o + 1)}
                className="w-10 h-10 rounded-full flex items-center justify-center active:scale-90"
                style={{ background: 'var(--soft)', color: 'var(--text)' }}>▶</button>
      </div>

      <div className="flex-1 overflow-y-auto p-4">
        <div className="rounded-3xl p-4" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
          <ArahChart data={points} height={220} />
          <div className="grid grid-cols-2 gap-2 mt-4">
            <div className="rounded-xl p-2.5" style={{ background: 'var(--soft)' }}>
              <div className="text-[10px] font-semibold uppercase" style={{ color: 'var(--muted)' }}>Perubahan Periode</div>
              <div className="text-lg font-bold"
                   style={{ color: stats.netInPeriod > 0 ? 'var(--pos)' : stats.netInPeriod < 0 ? 'var(--neg)' : 'var(--muted)' }}>
                {(stats.netInPeriod >= 0 ? '+' : '') + stats.netInPeriod}
              </div>
            </div>
            <div className="rounded-xl p-2.5" style={{ background: 'var(--soft)' }}>
              <div className="text-[10px] font-semibold uppercase" style={{ color: 'var(--muted)' }}>Kumulatif Akhir</div>
              <div className="text-lg font-bold">{(stats.lastCum >= 0 ? '+' : '') + stats.lastCum}</div>
            </div>
            <div className="rounded-xl p-2.5" style={{ background: 'var(--soft)' }}>
              <div className="text-[10px] font-semibold uppercase" style={{ color: 'var(--muted)' }}>Positif</div>
              <div className="text-lg font-bold" style={{ color: 'var(--pos)' }}>{stats.posCount}x</div>
            </div>
            <div className="rounded-xl p-2.5" style={{ background: 'var(--soft)' }}>
              <div className="text-[10px] font-semibold uppercase" style={{ color: 'var(--muted)' }}>Negatif</div>
              <div className="text-lg font-bold" style={{ color: 'var(--neg)' }}>{stats.negCount}x</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   KOMPONEN: ACCORDION AMAL
   ============================================================ */
function AmalAccordion({ item, expanded, onToggleExpand, onClickAmal, chartData, onOpenFull }) {
  const a = item.amal;
  const info = SIFAT_INFO[a.sifat];
  const isForbidden = a.sifat === 'makruh' || a.sifat === 'haram';
  const checkLabel = isForbidden ? 'Saya melanggar' : 'Saya mengerjakan';
  const record = item.record;
  const hasCatatan = !!(record?.catatan && record.catatan.trim());
  const currentDelta = computeScore(a.sifat, a.nilai, false, 0);

  return (
    <div className="rounded-2xl overflow-hidden mb-2"
         style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
      <div className="flex items-center gap-2 p-3">

            <span className="text-[9px] px-1.5 py-0.5 rounded-full font-bold uppercase"

            <span className="text-[9px] px-1.5 py-0.5 rounded-full font-bold uppercase"
                  style={{ background: 'var(--soft)', color: 'var(--muted)' }}>{a.periode}</span>
            {hasCatatan && (
              <span className="text-[10px]" style={{ color: 'var(--accent)' }} title="Ada catatan">📝</span>

          </div>
          <div className="text-[10px] mt-0.5 flex items-center gap-2" style={{ color: 'var(--muted)' }}>
            <span>{checkLabel}</span>
            <span>·</span>
            <span>{a.nilai} poin</span>
            <span>·</span>
            <span>belum</span>

          </button>
        </div>

    </div>
  );
}

      function DoneAccordion({ title, items, records, onEdit }) {
  const [open, setOpen] = useState(true);
  if (items.length === 0) return null;

  return (
    <div className="rounded-2xl overflow-hidden mb-2"
         style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
      <button
        onClick={() => setOpen(o => !o)}
        className="w-full flex items-center justify-between px-3 py-2.5 active:opacity-70 transition">
        <div className="flex items-center gap-2">
          <span className="text-xs font-bold uppercase tracking-wide" style={{ color: 'var(--pos)' }}>
            ✓ {title}
          </span>
          <span className="text-[10px] px-1.5 py-0.5 rounded-full font-bold"
                style={{ background: 'var(--pos)', color: '#fff' }}>{items.length}</span>
        </div>
        <span className="text-[10px]" style={{ color: 'var(--muted)' }}>
          {open ? '▲' : '▼'}
        </span>
      </button>

      {open && (
        <div className="px-2 pb-2" style={{ borderTop: '1px solid var(--line)' }}>
          {items.map(item => {
            const record = records[item.amal.id]?.[item.periodeKey] || {};
            const score = computeScore(item.amal.sifat, item.amal.nilai, true, record.bonus || 0);
            const info = SIFAT_INFO[item.amal.sifat];
            return (
              <button
                key={item.amal.id}
                onClick={() => onEdit(item.amal, item.periodeKey)}
                className="w-full flex items-start gap-2 p-2 mt-1.5 rounded-xl text-left active:opacity-70 transition"
                style={{ background: 'var(--soft)' }}>
                <div className="w-7 h-7 rounded-full flex items-center justify-center shrink-0 text-xs font-bold"
                     style={{ background: info.color, color: '#fff' }}>✓</div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <span className="text-sm font-semibold">{item.amal.nama}</span>
                    <span className="text-[9px] px-1.5 py-0.5 rounded-full font-bold uppercase"
                          style={{ background: info.color + '22', color: info.color }}>{info.label}</span>
                    {record.bonus ? (
                      <span className="text-[9px] px-1.5 py-0.5 rounded-full font-bold"
                            style={{ background: 'var(--accent)', color: '#fff' }}>
                        bonus {record.bonus > 0 ? '+' : ''}{record.bonus}
                      </span>
                    ) : null}
                  </div>
                  {record.catatan && (
                    <div className="text-[10px] mt-0.5 leading-snug line-clamp-2"
                         style={{ color: 'var(--muted)' }}>
                      📝 {record.catatan}
                    </div>
                  )}
                </div>
                <div className="text-sm font-bold shrink-0"
                     style={{ color: score >= 0 ? 'var(--pos)' : 'var(--neg)' }}>
                  {(score > 0 ? '+' : '') + score}
                </div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

   ============================================================ */
function TabBeranda({
  checklist, amal, records, summary, cumulativeChartData, chartDataByAmal,
  expandedAmals, onToggleExpand, onClickAmal, onEditDone, onOpenFull,
}) {
  const pending = checklist.filter(i => !i.checked);
  const doneHarian = checklist.filter(i => i.checked && i.amal.periode === 'harian');
  const doneMingguan = checklist.filter(i => i.checked && i.amal.periode === 'mingguan');
  const doneBulanan = checklist.filter(i => i.checked && i.amal.periode === 'bulanan');
  const doneTahunan = checklist.filter(i => i.checked && i.amal.periode === 'tahunan');
  const hasAnyDone = doneHarian.length + doneMingguan.length + doneBulanan.length + doneTahunan.length > 0;

  return (
    <div>
      {/* 1. KARTU SKOR KUMULATIF — di atas, di bawah header */}
      <KartuKumulatif
        summary={summary}
        chartData={cumulativeChartData}
        onOpenFull={() => onOpenFull({ mode: 'all' })}
      />

      {/* 2. DAFTAR AMAL BELUM DIKERJAKAN */}
      {checklist.length === 0 ? (
        <div className="rounded-2xl p-6 text-center text-sm leading-relaxed mb-4"
             style={{ background: 'var(--card)', border: '1px solid var(--line)', color: 'var(--muted)' }}>
          <div className="text-3xl mb-2">🧭</div>
          <div className="font-semibold mb-1" style={{ color: 'var(--text)' }}>Belum ada amal</div>
          <div>Buka sidebar → "Tambah Amal" untuk mendaftarkan amal pertama Anda.</div>
        </div>
      ) : pending.length === 0 ? (
        <div className="rounded-2xl p-4 text-center text-sm mb-4"
             style={{ background: 'var(--soft)', color: 'var(--pos)' }}>
          ✓ Semua amal periode ini sudah dikerjakan. Kerja bagus!
        </div>
      ) : (
        <div>
          {pending.map(item => (
            <AmalAccordion
              key={item.amal.id}
              item={item}
              expanded={!!expandedAmals[item.amal.id]}
              onToggleExpand={onToggleExpand}
              onClickAmal={() => onClickAmal(item.amal, item.periodeKey)}
              chartData={chartDataByAmal[item.amal.id] || []}
              onOpenFull={() => onOpenFull({ mode: 'single', amalId: item.amal.id })}
            />
          ))}
        </div>
      )}

      {/* 3. DIVIDER — pembatas antara daftar tugas dan data layer */}
      {hasAnyDone && (
        <hr style={{
          border: 'none',
          borderTop: '2px dashed var(--line)',
          margin: '20px 0 16px',
        }} />
      )}

      {/* 4. ACCORDION AMAL YANG SUDAH DIKERJAKAN (per periode) */}
      {hasAnyDone && (
        <div>
          <div className="text-[11px] font-bold uppercase mb-2 px-1 tracking-wide"
               style={{ color: 'var(--muted)' }}>
            Sudah Dikerjakan
          </div>
          <DoneAccordion title="Harian" items={doneHarian} records={records} onEdit={onEditDone} />
          <DoneAccordion title="Mingguan" items={doneMingguan} records={records} onEdit={onEditDone} />
          <DoneAccordion title="Bulanan" items={doneBulanan} records={records} onEdit={onEditDone} />
          <DoneAccordion title="Tahunan" items={doneTahunan} records={records} onEdit={onEditDone} />
        </div>
      )}
    </div>
  );
}

  );
}

  const [records, setRecords] = useState(() => {
    const raw = loadLS(LS_RECORDS, null);
    if (raw) return raw;
    // migrate dari format lama
    const old = loadLS(LS_CHECKS_OLD, {});
    const migrated = {};
    Object.keys(old).forEach(id => {
      migrated[id] = {};
      Object.keys(old[id]).forEach(pk => {
        migrated[id][pk] = { checked: true, catatan: '', bonus: 0, tanggalCheck: old[id][pk]?.tanggalCheck || '' };
      });
    });
    return migrated;
  });

  const [showForm, setShowForm] = useState(false);
  const [editingAmal, setEditingAmal] = useState(null);
  const [theme, setTheme] = useState(() => loadLS(LS_THEME, 'auto'));
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [dayOffset, setDayOffset] = useState(0);
  const [expandedAmals, setExpandedAmals] = useState({});
  const [fullView, setFullView] = useState(null);
  const [popupTarget, setPopupTarget] = useState(null); // { amal, periodeKey }
  const [realNow, setRealNow] = useState(new Date());

  useEffect(() => {
    const iv = setInterval(() => setRealNow(new Date()), 60000);
    return () => clearInterval(iv);
  }, []);

  const simDate = useMemo(() => {
    const d = new Date(realNow);
    d.setDate(d.getDate() + dayOffset);
    return d;
  }, [realNow, dayOffset]);

  useEffect(() => { saveLS(LS_AMAL, amal); }, [amal]);
  useEffect(() => { saveLS(LS_RECORDS, records); }, [records]);

  useEffect(() => {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    saveLS(LS_THEME, theme);
  }, [theme]);

  useEffect(() => {
    document.body.style.overflow = (sidebarOpen || showForm || fullView || popupTarget) ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [sidebarOpen, showForm, fullView, popupTarget]);

  const checklist = useMemo(() => {
    const items = [];
    amal.filter(a => a.active !== false).forEach(a => {
      const pk = getCurrentPeriodKey(a, simDate);
      const deadline = getDeadlineDate(a, pk);
      const record = records[a.id]?.[pk];
      items.push({
        amal: a,
        periodeKey: pk,
        deadline,
        record,
        checked: !!record?.checked,
      });
    });
    return items;
  }, [amal, records, simDate]);

  const summary = useMemo(() => {
    const entries = computeEntries(amal, records, simDate);
    const deltasByDate = groupDeltasByDate(entries, toKey(simDate));
    const simKey = toKey(simDate);
    const deltaToday = deltasByDate[simKey] || 0;
    const cumScore = Object.values(deltasByDate).reduce((s, v) => s + v, 0);

    let streak = 0;
    for (let i = 0; i < 400; i++) {
      const d = new Date(simDate); d.setDate(d.getDate() - i);
      const delta = deltasByDate[toKey(d)] || 0;
      if (i === 0) { if (delta > 0) streak++; continue; }
      if (delta > 0) streak++; else break;
    }
    let gap = 0;
    for (let i = 0; i < 400; i++) {
      const d = new Date(simDate); d.setDate(d.getDate() - i);
      const delta = deltasByDate[toKey(d)] || 0;
      if (delta < 0) gap++;
      else if (i === 0) continue;
      else break;
    }
    return { deltaToday, cumScore, streak, gap };
  }, [amal, records, simDate]);

  const chartDataByAmal = useMemo(() => {
    const start = new Date(simDate);
    start.setDate(start.getDate() - 29);
    start.setHours(0,0,0,0);
    const startKey = toKey(start);
    const simKey = toKey(simDate);

    const result = {};
    amal.forEach(a => {
      const entries = computeEntries([a], records, simDate);
      const deltasByDate = groupDeltasByDate(entries, simKey);
      let cum = 0;
      Object.keys(deltasByDate).forEach(k => { if (k < startKey) cum += deltasByDate[k]; });
      const pts = [];
      for (let d = new Date(start); d <= simDate; d.setDate(d.getDate() + 1)) {
        const k = toKey(d);
        cum += deltasByDate[k] || 0;
        pts.push({ date: k, cumScore: cum });
      }
      result[a.id] = pts;
    });
    return result;
  }, [amal, records, simDate]);

  const cumulativeChartData = useMemo(() => {
    const start = new Date(simDate);
    start.setDate(start.getDate() - 29);
    start.setHours(0,0,0,0);
    const startKey = toKey(start);
    const simKey = toKey(simDate);

    const entries = computeEntries(amal, records, simDate);
    const deltasByDate = groupDeltasByDate(entries, simKey);
    let cum = 0;
    Object.keys(deltasByDate).forEach(k => { if (k < startKey) cum += deltasByDate[k]; });
    const pts = [];
    for (let d = new Date(start); d <= simDate; d.setDate(d.getDate() + 1)) {
      const k = toKey(d);
      cum += deltasByDate[k] || 0;
      pts.push({ date: k, cumScore: cum });
    }
    return pts;
  }, [amal, records, simDate]);

  const handleSaveRecord = (amalId, periodeKey, data) => {
    setRecords(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next[amalId]) next[amalId] = {};
      const existing = next[amalId][periodeKey] || {};
      next[amalId][periodeKey] = {
        ...existing,
        ...data,
        tanggalCheck: data.checked
          ? (existing.tanggalCheck || toKey(new Date()))
          : existing.tanggalCheck,
        tanggalUpdate: toKey(new Date()),
      };
      return next;
    });
    setPopupTarget(null);
  };

  const handleSaveNotes = (amalId, periodeKey, catatanItems) => {
    setRecords(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next[amalId]) next[amalId] = {};
      const existing = next[amalId][periodeKey] || {};
      next[amalId][periodeKey] = {
        ...existing,
        catatanItems,
        // Pertahankan field lama agar kompatibel dengan tampilan/versi sebelumnya.
        catatan: catatanItems[0]?.content || '',
        tanggalUpdate: toKey(new Date()),
      };
      return next;
    });
    setPopupTarget(null);
  };

  const handleUncheck = (amalId, periodeKey) => {
    setRecords(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (next[amalId]?.[periodeKey]) {
        next[amalId][periodeKey] = {
          ...next[amalId][periodeKey],
          checked: false,
          bonus: 0,
          tanggalUpdate: toKey(new Date()),
        };
      }
      return next;
    });
    setPopupTarget(null);
  };

  const toggleExpand = (id) => setExpandedAmals(prev => ({ ...prev, [id]: !prev[id] }));

  const openPopup = (amalObj, periodeKey) => setPopupTarget({ amal: amalObj, periodeKey });

  const handleSaveAmal = (data) => {
    if (editingAmal) {
      setAmal(prev => prev.map(a => a.id === editingAmal.id ? { ...a, ...data } : a));
    } else {
      const newAmal = {
        id: 'amal_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        ...data,
        createdAt: new Date().toISOString(),
        active: true,
      };
      setAmal(prev => [...prev, newAmal]);
    }
    setShowForm(false);
    setEditingAmal(null);
  };

  const handleDeleteAmal = (id) => {
    if (!confirm('Hapus amal ini? Skor historis akan hilang.')) return;
    setAmal(prev => prev.filter(a => a.id !== id));
    setRecords(prev => { const n = { ...prev }; delete n[id]; return n; });
  };

  const openAddForm = () => { setEditingAmal(null); setShowForm(true); setSidebarOpen(false); };
  const simIsToday = dayOffset === 0;

  return (
    <>
      <Sidebar
        open={sidebarOpen}
        onClose={() => setSidebarOpen(false)}
        onAddAmal={openAddForm}
        tab={tab}
        setTab={setTab}
        theme={theme}
        setTheme={setTheme}
        onPrevDay={() => setDayOffset(o => o - 1)}
        onToday={() => setDayOffset(0)}
        onNextDay={() => setDayOffset(o => o + 1)}
        simIsToday={simIsToday}
      />

      <div className="mx-auto max-w-md min-h-screen px-4 pt-5 pb-8">
        <Header
          tab={tab}
          simDate={simDate}
          simIsToday={simIsToday}
          onOpenMenu={() => setSidebarOpen(true)}
          onPrevDay={() => setDayOffset(o => o - 1)}
          onToday={() => setDayOffset(0)}
          onNextDay={() => setDayOffset(o => o + 1)}
        />

        {tab === 'beranda' ? (
          <TabBeranda
            checklist={checklist}
            amal={amal}
            records={records}
            summary={summary}
            cumulativeChartData={cumulativeChartData}
            chartDataByAmal={chartDataByAmal}
            expandedAmals={expandedAmals}
            onToggleExpand={toggleExpand}
            onClickAmal={openPopup}
            onEditDone={openPopup}
            onOpenFull={setFullView}
          />
        ) : (
          <TabKelola
            amal={amal}
            onAdd={openAddForm}
            onEdit={(a) => { setEditingAmal(a); setShowForm(true); }}
            onDelete={handleDeleteAmal}
          />
        )}
      </div>

      {showForm && (
        <AmalForm
          initial={editingAmal}
          onSave={handleSaveAmal}
          onCancel={() => { setShowForm(false); setEditingAmal(null); }}
        />
      )}

      {popupTarget && (
        <AmalPopup
          amal={popupTarget.amal}
          periodeKey={popupTarget.periodeKey}
          record={records[popupTarget.amal.id]?.[popupTarget.periodeKey]}
          onSave={(data) => handleSaveRecord(popupTarget.amal.id, popupTarget.periodeKey, data)}
          onSaveNotes={(items) => handleSaveNotes(popupTarget.amal.id, popupTarget.periodeKey, items)}
          onUncheck={() => handleUncheck(popupTarget.amal.id, popupTarget.periodeKey)}
          onClose={() => setPopupTarget(null)}
        />
      )}

      {fullView && (
        <FullDataView
          mode={fullView.mode}
          amalId={fullView.amalId}
          allAmal={amal}
          records={records}
          simDate={simDate}
          onClose={() => setFullView(null)}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
