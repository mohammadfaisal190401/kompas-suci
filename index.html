                       onClick={() => { setTab('kalender'); onClose(); }}
                       active={tab === 'kalender'} />
          <SidebarItem icon="📋" label="Kelola Amal"
                       onClick={() => { setTab('kelola'); onClose(); }}
                       active={tab === 'kelola'} />

          <h3 className="text-[11px] font-bold uppercase mb-2 mt-5 px-1" style={{ color: 'var(--muted)' }}>Simulasi</h3>
          <div className="grid grid-cols-3 gap-1.5">
            <button onClick={onPrevDay}
                    className="py-2 rounded-xl text-xs font-semibold transition active:scale-95"
                    style={{ background: 'var(--soft)', color: 'var(--text)' }}>◀ Mundur</button>
            <button onClick={onToday}
                    className="py-2 rounded-xl text-xs font-semibold transition active:scale-95"
                    style={{
                      background: simIsToday ? 'var(--soft)' : 'var(--accent)',
                      color: simIsToday ? 'var(--text)' : 'var(--accent-text)',
                    }}>Hari ini</button>
            <button onClick={onNextDay}
                    className="py-2 rounded-xl text-xs font-semibold transition active:scale-95"
                    style={{ background: 'var(--soft)', color: 'var(--text)' }}>Maju ▶</button>
          </div>

          <h3 className="text-[11px] font-bold uppercase mb-2 mt-5 px-1" style={{ color: 'var(--muted)' }}>Tampilan</h3>
          <div className="grid grid-cols-3 gap-1 p-1 rounded-2xl" style={{ background: 'var(--soft)' }}>
            {[['auto','Auto'],['light','Terang'],['dark','Gelap']].map(([k, l]) => (
              <button key={k} onClick={() => setTheme(k)}
                      className="py-2 rounded-xl text-xs font-semibold transition active:scale-95"
                      style={{
                        background: theme === k ? 'var(--accent)' : 'transparent',
                        color: theme === k ? 'var(--accent-text)' : 'var(--text)',
                      }}>{l}</button>
            ))}
          </div>

          <div className="mt-8 pt-4 text-center text-[11px]"
               style={{ color: 'var(--muted)', lineHeight: 1.5 }}>
            <div className="font-semibold">Kompas v0.4</div>
            <div className="mt-0.5">Data tersimpan di browser Anda</div>
          </div>
        </div>
      </aside>
    </>
  );
}

/* ============================================================
   KOMPONEN: HEADER
   ============================================================ */
function Header({ tab, simDate, simIsToday, onOpenMenu, onPrevDay, onToday, onNextDay }) {
  const [hari, tanggal] = formatDateFull(simDate).split(', ');
  return (
    <div className="mb-4">
      <div className="flex items-center justify-between gap-2 mb-2">
        <div className="flex items-center gap-2 min-w-0">
          <button onClick={onOpenMenu}
                  className="w-11 h-11 rounded-full flex items-center justify-center active:scale-90 shrink-0"
                  style={{ background: 'var(--card)', border: '1px solid var(--line)', color: 'var(--text)' }}>☰</button>
          <div className="min-w-0">
            <div className="text-xl font-bold leading-tight">
              {tab === 'beranda' ? 'Beranda' : tab === 'kalender' ? 'Kalender' : 'Kelola Amal'}
            </div>
            <div className="text-[11px]" style={{ color: 'var(--muted)' }}>Kompas · Arah Hidup</div>
          </div>
        </div>
        <div className="flex items-center gap-1 shrink-0">
          <button onClick={onPrevDay}
                  className="w-9 h-9 rounded-full flex items-center justify-center active:scale-90"
                  style={{ background: 'var(--card)', border: '1px solid var(--line)', color: 'var(--text)' }}
                  title="Mundur 1 hari">◀</button>
          <button onClick={onToday}
                  className="px-2.5 h-9 rounded-full flex flex-col items-center justify-center active:scale-95"
                  style={{
                    background: simIsToday ? 'var(--card)' : 'var(--accent)',
                    border: simIsToday ? '1px solid var(--line)' : 'none',
                    color: simIsToday ? 'var(--text)' : 'var(--accent-text)',
                    minWidth: 110,
                  }}
                  title={simIsToday ? 'Hari ini' : 'Kembali ke hari ini'}>
            <div className="text-[10px] font-semibold leading-tight">{hari}</div>
            <div className="text-[11px] font-bold leading-tight">{tanggal}</div>
          </button>
          <button onClick={onNextDay}
                  className="w-9 h-9 rounded-full flex items-center justify-center active:scale-90"
                  style={{ background: 'var(--card)', border: '1px solid var(--line)', color: 'var(--text)' }}
                  title="Maju 1 hari">▶</button>
        </div>
      </div>
      {!simIsToday && (
        <div className="text-center text-[11px] font-semibold py-1.5 rounded-xl"
             style={{ background: 'var(--accent)', color: 'var(--accent-text)' }}>
          🧪 Mode Simulasi · simulasi hari ke-{simDate.getDate()} · ketuk tanggal untuk reset
        </div>
      )}
    </div>
  );
}

/* ============================================================
   KOMPONEN: TAB BERANDA
   ============================================================ */
function TabBeranda({
  checklist, amal, records, summary, cumulativeChartData, chartDataByAmal,
  expandedAmals, onToggleExpand, onClickAmal, onEditDone, onOpenFull,
}) {
  const pending = checklist.filter(i => !i.checked);
  const doneHarian = checklist.filter(i => i.checked && i.amal.periode === 'harian');
  const doneMingguan = checklist.filter(i => i.checked && i.amal.periode === 'mingguan');
  const doneBulanan = checklist.filter(i => i.checked && i.amal.periode === 'bulanan');
  const doneTahunan = checklist.filter(i => i.checked && i.amal.periode === 'tahunan');
  const hasAnyDone = doneHarian.length + doneMingguan.length + doneBulanan.length + doneTahunan.length > 0;

  return (
    <div>
      {/* 1. KARTU SKOR KUMULATIF — di atas, di bawah header */}
      <KartuKumulatif
        summary={summary}
        chartData={cumulativeChartData}
        onOpenFull={() => onOpenFull({ mode: 'all' })}
      />

      {/* 2. DAFTAR AMAL BELUM DIKERJAKAN */}
      {checklist.length === 0 ? (
        <div className="rounded-2xl p-6 text-center text-sm leading-relaxed mb-4"
             style={{ background: 'var(--card)', border: '1px solid var(--line)', color: 'var(--muted)' }}>
          <div className="text-3xl mb-2">🧭</div>
          <div className="font-semibold mb-1" style={{ color: 'var(--text)' }}>Belum ada amal</div>
          <div>Buka sidebar → "Tambah Amal" untuk mendaftarkan amal pertama Anda.</div>
        </div>
      ) : pending.length === 0 ? (
        <div className="rounded-2xl p-4 text-center text-sm mb-4"
             style={{ background: 'var(--soft)', color: 'var(--pos)' }}>
          ✓ Semua amal periode ini sudah dikerjakan. Kerja bagus!
        </div>
      ) : (
        <div>
          {pending.map(item => (
            <AmalAccordion
              key={item.amal.id}
              item={item}
              expanded={!!expandedAmals[item.amal.id]}
              onToggleExpand={onToggleExpand}
              onClickAmal={() => onClickAmal(item.amal, item.periodeKey)}
              chartData={chartDataByAmal[item.amal.id] || []}
              onOpenFull={() => onOpenFull({ mode: 'single', amalId: item.amal.id })}
            />
          ))}
        </div>
      )}

      {/* 3. DIVIDER — pembatas antara daftar tugas dan data layer */}
      {hasAnyDone && (
        <hr style={{
          border: 'none',
          borderTop: '2px dashed var(--line)',
          margin: '20px 0 16px',
        }} />
      )}

      {/* 4. ACCORDION AMAL YANG SUDAH DIKERJAKAN (per periode) */}
      {hasAnyDone && (
        <div>
          <div className="text-[11px] font-bold uppercase mb-2 px-1 tracking-wide"
               style={{ color: 'var(--muted)' }}>
            Sudah Dikerjakan
          </div>
          <DoneAccordion title="Harian" items={doneHarian} expandedAmals={expandedAmals} onToggleExpand={onToggleExpand} chartDataByAmal={chartDataByAmal} onEdit={onEditDone} onOpenFull={onOpenFull} />
          <DoneAccordion title="Mingguan" items={doneMingguan} expandedAmals={expandedAmals} onToggleExpand={onToggleExpand} chartDataByAmal={chartDataByAmal} onEdit={onEditDone} onOpenFull={onOpenFull} />
          <DoneAccordion title="Bulanan" items={doneBulanan} expandedAmals={expandedAmals} onToggleExpand={onToggleExpand} chartDataByAmal={chartDataByAmal} onEdit={onEditDone} onOpenFull={onOpenFull} />
          <DoneAccordion title="Tahunan" items={doneTahunan} expandedAmals={expandedAmals} onToggleExpand={onToggleExpand} chartDataByAmal={chartDataByAmal} onEdit={onEditDone} onOpenFull={onOpenFull} />
        </div>
      )}

      {amal.length === 0 && (
        <div className="rounded-2xl p-4 text-center text-xs leading-relaxed mb-4 mt-4"
             style={{ background: 'var(--soft)', color: 'var(--muted)' }}>
          Tip: gunakan tombol ◀ ▶ di header untuk simulasi hari maju/mundur dan melihat perilaku sistem.
        </div>
      )}
    </div>
  );
}

/* ============================================================
   KOMPONEN: TAB KELOLA
   ============================================================ */
function TabKelola({ amal, onAdd, onEdit, onDelete }) {
  return (
    <div>
      <div className="rounded-3xl p-4 mb-4"
           style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>
        <div className="flex items-center justify-between px-1 pb-2">
          <div className="text-sm font-bold">Daftar Amal</div>
          <button onClick={onAdd}
                  className="flex items-center gap-1 px-2.5 py-1.5 rounded-full text-xs font-semibold active:scale-95 transition"
                  style={{ background: 'var(--accent)', color: 'var(--accent-text)' }}>
            + Tambah
          </button>
        </div>

        {amal.length === 0 ? (
          <div className="text-sm px-1 py-6 text-center" style={{ color: 'var(--muted)' }}>
            Belum ada amal. Ketuk "+ Tambah" untuk mendaftarkan amal pertama Anda.
          </div>
        ) : (
          <div className="space-y-2 mt-1">
            {amal.map(a => {
              const info = SIFAT_INFO[a.sifat];
              return (
                <div key={a.id} className="flex items-start gap-2 p-3 rounded-xl"
                     style={{ background: 'var(--soft)' }}>
                  <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 text-base"
                       style={{ background: info.color, color: '#fff' }}>{info.icon}</div>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold truncate">{a.nama}</div>
                    <div className="flex items-center gap-1.5 flex-wrap mt-0.5">
                      <span className="text-[9px] px-1.5 py-0.5 rounded-full font-bold uppercase"
                            style={{ background: info.color + '22', color: info.color }}>{info.label}</span>
                      <span className="text-[10px]" style={{ color: 'var(--muted)' }}>
                        {a.periode + ' · ' + a.nilai + ' poin'}
                      </span>
                    </div>
                  </div>
                  <div className="flex flex-col gap-1 shrink-0">
                    <button onClick={() => onEdit(a)}
                            className="w-7 h-7 rounded-full flex items-center justify-center text-xs active:scale-90"
                            style={{ background: 'var(--card)', color: 'var(--accent)' }}
                            title="Edit">✎</button>
                    <button onClick={() => onDelete(a.id)}
                            className="w-7 h-7 rounded-full flex items-center justify-center text-xs active:scale-90"
                            style={{ background: 'var(--card)', color: 'var(--neg)' }}
                            title="Hapus">🗑</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="rounded-2xl p-4 text-xs leading-relaxed"
           style={{ background: 'var(--soft)', color: 'var(--muted)' }}>
        <div className="font-bold mb-1.5" style={{ color: 'var(--text)' }}>ℹ️ Rumus Skor</div>
        <div className="mb-1">· Wajib: dikerjakan +N, ditinggal −N.</div>
        <div className="mb-1">· Sunah: dikerjakan +N, ditinggal 0.</div>
        <div className="mb-1">· Makruh: dikerjakan 0, ditinggal +N.</div>
        <div className="mb-1">· Haram: dikerjakan −N, ditinggal +N.</div>
        <div className="mt-2 pt-2" style={{ borderTop: '1px solid var(--line)' }}>
          Bonus pahala hanya dihitung saat amal ditandai selesai.
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [tab, setTab] = useState('beranda');
  const [amal, setAmal] = useState(() => loadLS(LS_AMAL, []));

  // records: { [amalId]: { [periodeKey]: { checked, catatan, bonus, tanggalCheck, tanggalUpdate } } }
  const [records, setRecords] = useState(() => {
    const raw = loadLS(LS_RECORDS, null);
    if (raw) return raw;
    // migrate dari format lama
    const old = loadLS(LS_CHECKS_OLD, {});
    const migrated = {};
    Object.keys(old).forEach(id => {
      migrated[id] = {};
      Object.keys(old[id]).forEach(pk => {
        migrated[id][pk] = { checked: true, catatan: '', bonus: 0, tanggalCheck: old[id][pk]?.tanggalCheck || '' };
      });
    });
    return migrated;
  });

  const [showForm, setShowForm] = useState(false);
  const [editingAmal, setEditingAmal] = useState(null);
  const [theme, setTheme] = useState(() => loadLS(LS_THEME, 'auto'));
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [dayOffset, setDayOffset] = useState(0);
  const [expandedAmals, setExpandedAmals] = useState({});
  const [fullView, setFullView] = useState(null);
  const [popupTarget, setPopupTarget] = useState(null); // { amal, periodeKey }
  const [realNow, setRealNow] = useState(new Date());

  useEffect(() => {
    const iv = setInterval(() => setRealNow(new Date()), 60000);
    return () => clearInterval(iv);
  }, []);

  const simDate = useMemo(() => {
    const d = new Date(realNow);
    d.setDate(d.getDate() + dayOffset);
    return d;
  }, [realNow, dayOffset]);

  useEffect(() => { saveLS(LS_AMAL, amal); }, [amal]);
  useEffect(() => { saveLS(LS_RECORDS, records); }, [records]);

  useEffect(() => {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    saveLS(LS_THEME, theme);
  }, [theme]);

  useEffect(() => {
    document.body.style.overflow = (sidebarOpen || showForm || fullView || popupTarget) ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [sidebarOpen, showForm, fullView, popupTarget]);

  const checklist = useMemo(() => {
    const items = [];
    amal.filter(a => a.active !== false).forEach(a => {
      const pk = getCurrentPeriodKey(a, simDate);
      const deadline = getDeadlineDate(a, pk);
      const record = records[a.id]?.[pk];
      items.push({
        amal: a,
        periodeKey: pk,
        deadline,
        record,
        checked: !!record?.checked,
      });
    });
    return items;
  }, [amal, records, simDate]);

  const summary = useMemo(() => {
    const entries = computeEntries(amal, records, simDate);
    const deltasByDate = groupDeltasByDate(entries, toKey(simDate));
    const simKey = toKey(simDate);
    const deltaToday = deltasByDate[simKey] || 0;
    const cumScore = Object.values(deltasByDate).reduce((s, v) => s + v, 0);

    let streak = 0;
    for (let i = 0; i < 400; i++) {
      const d = new Date(simDate); d.setDate(d.getDate() - i);
      const delta = deltasByDate[toKey(d)] || 0;
      if (i === 0) { if (delta > 0) streak++; continue; }
      if (delta > 0) streak++; else break;
    }
    let gap = 0;
    for (let i = 0; i < 400; i++) {
      const d = new Date(simDate); d.setDate(d.getDate() - i);
      const delta = deltasByDate[toKey(d)] || 0;
      if (delta < 0) gap++;
      else if (i === 0) continue;
      else break;
    }
    return { deltaToday, cumScore, streak, gap };
  }, [amal, records, simDate]);

  const chartDataByAmal = useMemo(() => {
    const start = new Date(simDate);
    start.setDate(start.getDate() - 29);
    start.setHours(0,0,0,0);
    const startKey = toKey(start);
    const simKey = toKey(simDate);

    const result = {};
    amal.forEach(a => {
      const entries = computeEntries([a], records, simDate);
      const deltasByDate = groupDeltasByDate(entries, simKey);
      let cum = 0;
      Object.keys(deltasByDate).forEach(k => { if (k < startKey) cum += deltasByDate[k]; });
      const pts = [];
      for (let d = new Date(start); d <= simDate; d.setDate(d.getDate() + 1)) {
        const k = toKey(d);
        cum += deltasByDate[k] || 0;
        pts.push({ date: k, cumScore: cum });
      }
      result[a.id] = pts;
    });
    return result;
  }, [amal, records, simDate]);

  const cumulativeChartData = useMemo(() => {
    const start = new Date(simDate);
    start.setDate(start.getDate() - 29);
    start.setHours(0,0,0,0);
    const startKey = toKey(start);
    const simKey = toKey(simDate);

    const entries = computeEntries(amal, records, simDate);
    const deltasByDate = groupDeltasByDate(entries, simKey);
    let cum = 0;
    Object.keys(deltasByDate).forEach(k => { if (k < startKey) cum += deltasByDate[k]; });
    const pts = [];
    for (let d = new Date(start); d <= simDate; d.setDate(d.getDate() + 1)) {
      const k = toKey(d);
      cum += deltasByDate[k] || 0;
      pts.push({ date: k, cumScore: cum });
    }
    return pts;
  }, [amal, records, simDate]);

  const handleSaveRecord = (amalId, periodeKey, data) => {
    setRecords(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next[amalId]) next[amalId] = {};
      const existing = next[amalId][periodeKey] || {};
      next[amalId][periodeKey] = {
        ...existing,
        ...data,
        tanggalCheck: data.checked
          ? (existing.tanggalCheck || toKey(new Date()))
          : existing.tanggalCheck,
        tanggalUpdate: toKey(new Date()),
      };
      return next;
    });
    setPopupTarget(null);
  };

  const handleSaveNotes = (amalId, periodeKey, catatanItems) => {
    setRecords(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next[amalId]) next[amalId] = {};
      const existing = next[amalId][periodeKey] || {};
      next[amalId][periodeKey] = {
        ...existing,
        catatanItems,
        // Pertahankan field lama agar kompatibel dengan tampilan/versi sebelumnya.
        catatan: catatanItems[0]?.content || '',
        tanggalUpdate: toKey(new Date()),
      };
      return next;
    });
    setPopupTarget(null);
  };

  const handleUncheck = (amalId, periodeKey) => {
    setRecords(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (next[amalId]?.[periodeKey]) {
        next[amalId][periodeKey] = {
          ...next[amalId][periodeKey],
          checked: false,
          bonus: 0,
          tanggalUpdate: toKey(new Date()),
        };
      }
      return next;
    });
    setPopupTarget(null);
  };

  const toggleExpand = (id) => setExpandedAmals(prev => ({ ...prev, [id]: !prev[id] }));

  const openPopup = (amalObj, periodeKey) => setPopupTarget({ amal: amalObj, periodeKey });

  const handleSaveAmal = (data) => {
    if (editingAmal) {
      setAmal(prev => prev.map(a => a.id === editingAmal.id ? { ...a, ...data } : a));
    } else {
      const newAmal = {
        id: 'amal_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        ...data,
        createdAt: new Date().toISOString(),
        active: true,
      };
      setAmal(prev => [...prev, newAmal]);
    }
    setShowForm(false);
    setEditingAmal(null);
  };

  const handleDeleteAmal = (id) => {
    if (!confirm('Hapus amal ini? Skor historis akan hilang.')) return;
    setAmal(prev => prev.filter(a => a.id !== id));
    setRecords(prev => { const n = { ...prev }; delete n[id]; return n; });
  };

  const openAddForm = () => { setEditingAmal(null); setShowForm(true); setSidebarOpen(false); };
  const simIsToday = dayOffset === 0;

  return (
    <>
      <Sidebar
        open={sidebarOpen}
        onClose={() => setSidebarOpen(false)}
        onAddAmal={openAddForm}
        tab={tab}
        setTab={setTab}
        theme={theme}
        setTheme={setTheme}
        onPrevDay={() => setDayOffset(o => o - 1)}
        onToday={() => setDayOffset(0)}
        onNextDay={() => setDayOffset(o => o + 1)}
        simIsToday={simIsToday}
      />

      <div className="mx-auto max-w-md min-h-screen px-4 pt-5 pb-8">
        <Header
          tab={tab}
          simDate={simDate}
          simIsToday={simIsToday}
          onOpenMenu={() => setSidebarOpen(true)}
          onPrevDay={() => setDayOffset(o => o - 1)}
          onToday={() => setDayOffset(0)}
          onNextDay={() => setDayOffset(o => o + 1)}
        />

        {tab === 'beranda' ? (
          <TabBeranda
            checklist={checklist}
            amal={amal}
            records={records}
            summary={summary}
            cumulativeChartData={cumulativeChartData}
            chartDataByAmal={chartDataByAmal}
            expandedAmals={expandedAmals}
            onToggleExpand={toggleExpand}
            onClickAmal={openPopup}
            onEditDone={openPopup}
            onOpenFull={setFullView}
          />
        ) : tab === 'kalender' ? (
          <TabKalender amal={amal} records={records} simDate={simDate} onManage={openPopup} />
        ) : (
          <TabKelola
            amal={amal}
            onAdd={openAddForm}
            onEdit={(a) => { setEditingAmal(a); setShowForm(true); }}
            onDelete={handleDeleteAmal}
          />
        )}
      </div>

      {showForm && (
        <AmalForm
          initial={editingAmal}
          onSave={handleSaveAmal}
          onCancel={() => { setShowForm(false); setEditingAmal(null); }}
        />
      )}

      {popupTarget && (
        <AmalPopup
          amal={popupTarget.amal}
          periodeKey={popupTarget.periodeKey}
          record={records[popupTarget.amal.id]?.[popupTarget.periodeKey]}
          onSave={(data) => handleSaveRecord(popupTarget.amal.id, popupTarget.periodeKey, data)}
          onSaveNotes={(items) => handleSaveNotes(popupTarget.amal.id, popupTarget.periodeKey, items)}
          onUncheck={() => handleUncheck(popupTarget.amal.id, popupTarget.periodeKey)}
          onClose={() => setPopupTarget(null)}
        />
      )}

      {fullView && (
        <FullDataView
          mode={fullView.mode}
          amalId={fullView.amalId}
          allAmal={amal}
          records={records}
          simDate={simDate}
          onManage={openPopup}
          onClose={() => setFullView(null)}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
