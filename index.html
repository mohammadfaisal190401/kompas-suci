<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kompas — Pemantau Arah Hidup</title>
<style>
  /* Reset & Base */
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #0f111a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

  /* Modal Container - DIPERBAIKI: Dinaikkan 80px dari bawah agar tidak tertutup Netlify Badge */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: flex-end;
    z-index: 1000;
  }
  .modal-content {
    background: #1a1d2d; width: 100%; max-width: 500px;
    border-radius: 24px 24px 0 0; padding: 24px;
    /* PERBAIKAN POSISI: bottom 80px memberi ruang untuk badge Netlify */
    margin-bottom: 80px; 
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
  }

  /* Header */
  .header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .icon-box {
    width: 56px; height: 56px; background: #7c8cf8; border-radius: 14px;
    display: flex; justify-content: center; align-items: center; font-size: 28px;
  }
  .title-group h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .title-group p { font-size: 14px; color: #8b92a5; }
  .close-btn {
    margin-left: auto; width: 40px; height: 40px; border-radius: 50%;
    background: #2a2e45; border: none; color: #8b92a5; font-size: 20px; cursor: pointer;
  }

  /* Checkbox Section (Fitur Asli - JANGAN DIHAPUS) */
  .progress-section {
    background: #252940; padding: 16px; border-radius: 12px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
  }
  .progress-section input[type="checkbox"] { width: 20px; height: 20px; accent-color: #7c8cf8; }
  .progress-section label { font-size: 16px; cursor: pointer; }

  /* Notes Section */
  .notes-section { margin-bottom: 24px; }
  .notes-section h3 { font-size: 16px; color: #8b92a5; margin-bottom: 12px; font-weight: 500; }
  
  /* Daftar Judul Catatan */
  .note-list {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
  }
  .note-title-btn {
    background: #2a2e45; color: #fff; border: 1px solid #3b405e;
    padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
    transition: all 0.2s;
  }
  .note-title-btn.active { background: #7c8cf8; border-color: #7c8cf8; }
  .note-title-btn:hover { background: #3b405e; }

  /* Tombol Tambah Catatan Kecil */
  .btn-add-small {
    background: transparent; color: #7c8cf8; border: 1px dashed #7c8cf8;
    padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
    margin-bottom: 12px; display: inline-block;
  }
  .btn-add-small:hover { background: rgba(124, 140, 248, 0.1); }

  /* Textarea */
  textarea {
    width: 100%; background: #252940; border: 1px solid #3b405e; border-radius: 12px;
    padding: 16px; color: #fff; font-size: 15px; resize: vertical; min-height: 100px;
    outline: none; transition: border 0.2s;
  }
  textarea:focus { border-color: #7c8cf8; }
  textarea::placeholder { color: #6b7280; }

  /* Note Action Buttons */
  .note-actions { display: flex; gap: 12px; margin-top: 12px; }
  .btn-primary {
    flex: 1; background: #7c8cf8; color: #fff; border: none; padding: 14px;
    border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:hover { background: #6a7af0; }
  .btn-danger {
    background: #ff4d4f; color: #fff; border: none; padding: 14px 20px;
    border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-danger:hover { background: #d9363e; }

  /* Bonus Section (Fitur Asli) */
  .bonus-section { border-top: 1px solid #2a2e45; padding-top: 20px; }
  .bonus-section h3 { color: #7c8cf8; font-size: 14px; margin-bottom: 16px; letter-spacing: 0.5px; }
  .bonus-input {
    width: 100%; background: #252940; border: 1px solid #3b405e; border-radius: 12px;
    padding: 14px; color: #fff; font-size: 16px; margin-bottom: 8px;
  }
  .hint { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
  .main-actions { display: flex; gap: 12px; }
  .btn-secondary {
    flex: 1; background: #2a2e45; color: #fff; border: none; padding: 14px;
    border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
  }

  /* Custom Confirm Modal */
  .confirm-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center;
    z-index: 2000;
  }
  .confirm-box {
    background: #1a1d2d; padding: 24px; border-radius: 16px; width: 90%; max-width: 350px;
    text-align: center;
  }
  .confirm-box p { margin-bottom: 20px; font-size: 16px; }
  .confirm-actions { display: flex; flex-direction: column; gap: 10px; }
  .confirm-actions button { padding: 12px; border-radius: 8px; border: none; font-size: 15px; cursor: pointer; }
  .btn-confirm-save { background: #7c8cf8; color: #fff; }
  .btn-confirm-new { background: #2a2e45; color: #fff; }
  .btn-confirm-cancel { background: transparent; color: #8b92a5; }

</style>
</head>
<body>

<!-- Modal Utama -->
<div class="modal-overlay" id="mainModal">
  <div class="modal-content">
    
    <!-- Header -->
    <div class="header">
      <div class="icon-box">✅</div>
      <div class="title-group">
        <h2>Olah raga</h2>
        <p>Wajib · 1 poin · harian</p>
      </div>
      <button class="close-btn">✕</button>
    </div>

    <!-- FITUR ASLI: Centang Progres (JANGAN DIHAPUS/DIRUSAK) -->
    <div class="progress-section" onclick="document.getElementById('taskCheck').click()">
      <input type="checkbox" id="taskCheck">
      <label for="taskCheck">Tandai selesai hari ini</label>
    </div>

    <!-- SISTEM CATATAN BARU -->
    <div class="notes-section">
      <h3>Catatan (opsional)</h3>
      
      <!-- Daftar Judul Catatan (Muncul jika > 1 catatan) -->
      <div id="noteList" class="note-list" style="display: none;"></div>
      
      <!-- Tombol Tambah Catatan Baru (Muncul jika >= 1 catatan) -->
      <button id="btnAddNewNote" class="btn-add-small" style="display: none;">+ Tambah Catatan Baru</button>

      <!-- Input Catatan -->
      <textarea id="noteInput" placeholder="Catatan, rencana, atau apapun yang ingin kamu tulis..."></textarea>

      <!-- Tombol Aksi Catatan -->
      <div class="note-actions">
        <button id="btnDeleteNote" class="btn-danger" style="display: none;">Hapus</button>
        <button id="btnSaveNote" class="btn-primary">Simpan</button>
      </div>
    </div>

    <!-- FITUR ASLI: Bonus Pahala (JANGAN DIHAPUS/DIRUSAK) -->
    <div class="bonus-section">
      <h3>TAMBAHKAN BONUS PAHALA</h3>
      <input type="number" class="bonus-input" value="0" placeholder="0">
      <p class="hint">Misal +5 karena amal istimewa, atau -5 karena kurang sempurna. Kosongkan untuk 0.</p>
      <div class="main-actions">
        <button class="btn-secondary">Kembali</button>
        <button class="btn-primary">Simpan Semua</button>
      </div>
    </div>

  </div>
</div>

<!-- Custom Confirm Popup -->
<div class="confirm-overlay" id="confirmModal">
  <div class="confirm-box">
    <p id="confirmText">Simpan catatan ini?</p>
    <div class="confirm-actions" id="confirmActions">
      <!-- Buttons injected by JS -->
    </div>
  </div>
</div>

<script>
  // --- STATE MANAGEMENT ---
  // Simulasi database local storage untuk catatan
  let notes = []; // Format: { id: number, title: string, content: string }
  let activeNoteId = null; // null = sedang membuat catatan baru

  // --- DOM ELEMENTS ---
  const noteInput = document.getElementById('noteInput');
  const btnSaveNote = document.getElementById('btnSaveNote');
  const btnDeleteNote = document.getElementById('btnDeleteNote');
  const btnAddNewNote = document.getElementById('btnAddNewNote');
  const noteList = document.getElementById('noteList');
  
  const confirmModal = document.getElementById('confirmModal');
  const confirmText = document.getElementById('confirmText');
  const confirmActions = document.getElementById('confirmActions');

  // --- FUNGSI RENDER UI CATATAN ---
  function renderNotesUI() {
    noteList.innerHTML = '';
    
    if (notes.length === 0) {
      // KONDISI 0: Form kosong, tombol Simpan, tidak ada list, tidak ada tombol tambah/hapus
      noteList.style.display = 'none';
      btnAddNewNote.style.display = 'none';
      btnDeleteNote.style.display = 'none';
      noteInput.value = '';
      btnSaveNote.textContent = 'Simpan';
      activeNoteId = null;
      
    } else if (notes.length === 1) {
      // KONDISI 1: Langsung isi form, tombol Ubah, ada tombol Tambah & Hapus
      const singleNote = notes[0];
      activeNoteId = singleNote.id;
      noteInput.value = singleNote.content;
      btnSaveNote.textContent = 'Ubah';
      btnDeleteNote.style.display = 'block';
      btnAddNewNote.style.display = 'inline-block';
      noteList.style.display = 'none'; // Hanya 1, tidak perlu list
      
    } else {
      // KONDISI >1: Form kosong, ada list judul, ada tombol Tambah
      noteList.style.display = 'flex';
      btnAddNewNote.style.display = 'inline-block';
      btnDeleteNote.style.display = 'none'; // Sembunyikan dulu sampai user pilih salah satu
      noteInput.value = '';
      btnSaveNote.textContent = 'Simpan';
      activeNoteId = null;

      notes.forEach(note => {
        const btn = document.createElement('button');
        btn.className = 'note-title-btn';
        btn.textContent = note.title;
        btn.onclick = () => selectNote(note.id);
        noteList.appendChild(btn);
      });
    }
  }

  // --- FUNGSI PILIH CATATAN DARI LIST ---
  function selectNote(id) {
    activeNoteId = id;
    const note = notes.find(n => n.id === id);
    if (note) {
      noteInput.value = note.content;
      btnSaveNote.textContent = 'Ubah';
      btnDeleteNote.style.display = 'block';
      
      // Highlight tombol yang aktif
      document.querySelectorAll('.note-title-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  }

  // --- FUNGSI TOMBOL TAMBAH CATATAN BARU ---
  btnAddNewNote.onclick = () => {
    activeNoteId = null;
    noteInput.value = '';
    btnSaveNote.textContent = 'Simpan';
    btnDeleteNote.style.display = 'none';
    document.querySelectorAll('.note-title-btn').forEach(btn => btn.classList.remove('active'));
    noteInput.focus();
  };

  // --- FUNGSI TOMBOL HAPUS ---
  btnDeleteNote.onclick = () => {
    if (activeNoteId !== null) {
      showConfirm('Hapus catatan ini secara permanen?', [
        { text: 'Ya, Hapus', class: 'btn-confirm-save', action: () => {
            notes = notes.filter(n => n.id !== activeNoteId);
            renderNotesUI();
            closeConfirm();
        }},
        { text: 'Batal', class: 'btn-confirm-cancel', action: closeConfirm }
      ]);
    }
  };

  // --- FUNGSI TOMBOL SIMPAN / UBAH ---
  btnSaveNote.onclick = () => {
    const content = noteInput.value.trim();
    if (!content) return alert('Tulis sesuatu dulu di catatan.');

    if (activeNoteId !== null) {
      // Sedang mengedit catatan lama -> Opsi: Update atau Simpan Baru
      showConfirm('Apa yang ingin kamu lakukan?', [
        { text: 'Update Catatan Ini', class: 'btn-confirm-save', action: () => {
            const note = notes.find(n => n.id === activeNoteId);
            note.content = content;
            renderNotesUI();
            closeConfirm();
        }},
        { text: 'Simpan Sebagai Catatan Baru', class: 'btn-confirm-new', action: () => {
            addNewNote(content);
            closeConfirm();
        }},
        { text: 'Batal', class: 'btn-confirm-cancel', action: closeConfirm }
      ]);
    } else {
      // Membuat catatan baru langsung
      showConfirm('Simpan sebagai catatan baru?', [
        { text: 'Ya, Simpan', class: 'btn-confirm-save', action: () => {
            addNewNote(content);
            closeConfirm();
        }},
        { text: 'Batal', class: 'btn-confirm-cancel', action: closeConfirm }
      ]);
    }
  };

  // --- HELPER: Tambah Catatan Baru ke Array ---
  function addNewNote(content) {
    const newId = Date.now();
    const title = 'Catatan ' + (notes.length + 1); // Auto title sederhana
    notes.push({ id: newId, title: title, content: content });
    renderNotesUI();
  }

  // --- HELPER: Custom Confirm Modal ---
  function showConfirm(text, buttons) {
    confirmText.textContent = text;
    confirmActions.innerHTML = '';
    buttons.forEach(btn => {
      const el = document.createElement('button');
      el.textContent = btn.text;
      el.className = btn.class;
      el.onclick = btn.action;
      confirmActions.appendChild(el);
    });
    confirmModal.style.display = 'flex';
  }

  function closeConfirm() {
    confirmModal.style.display = 'none';
  }

  // --- INISIALISASI ---
  renderNotesUI();

  // Close modal buttons
  document.querySelector('.close-btn').onclick = () => document.getElementById('mainModal').style.display = 'none';
</script>

</body>
</html>
