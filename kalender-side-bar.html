const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const toKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function dayOfYear(d) { return Math.round((startOfDay(d) - new Date(d.getFullYear(), 0, 1)) / 86400000) + 1; }
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const n = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - n);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
}
function selisih(d, today) {
  const n = Math.round((startOfDay(d) - startOfDay(today)) / 86400000);
  if (n === 0) return "Hari ini";
  if (n === 1) return "Besok";
  if (n === -1) return "Kemarin";
  return n > 0 ? n + " hari lagi" : Math.abs(n) + " hari lalu";
}

/* ---------- API ---------- */
async function apiGet(action) {
  const url = API_URL + (API_URL.includes('?') ? '&' : '?') + 'action=' + encodeURIComponent(action);
  const res = await fetch(url, { method: 'GET' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function apiPost(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
const apiConfigured = () => API_URL && !API_URL.includes('PASTE_');

function App() {
  const today = new Date();
  const [view, setView] = useState({ y: today.getFullYear(), m: today.getMonth() });
  const [selected, setSelected] = useState(startOfDay(today));
  const [picker, setPicker] = useState(null);
  const [yearBase, setYearBase] = useState(Math.floor(today.getFullYear() / 12) * 12);
  const touch = useRef(null);

  /* state sidebar & tema */
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('kalender-theme') || 'auto'; } catch { return 'auto'; }
  });

  /* state catatan */
  const [notes, setNotes] = useState([]);
  const [notesLoading, setNotesLoading] = useState(true);
  const [notesError, setNotesError] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [editingNote, setEditingNote] = useState(null);
  const [saving, setSaving] = useState(false);
  const [formJudul, setFormJudul] = useState('');
  const [formCatatan, setFormCatatan] = useState('');
  const [formStatus, setFormStatus] = useState('rencana');

  const selectedKey = toKey(selected);

  /* ---------- efek tema ---------- */
  useEffect(() => {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('kalender-theme', theme); } catch {}
  }, [theme]);

  /* ---------- kunci scroll saat sidebar terbuka ---------- */
  useEffect(() => {
    document.body.style.overflow = sidebarOpen ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [sidebarOpen]);

  /* ---------- tutup sidebar dengan ESC ---------- */
  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') setSidebarOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  /* ---------- load catatan ---------- */
  const loadNotes = async () => {
    if (!apiConfigured()) {
      setNotesLoading(false);
      setNotesError('URL Apps Script belum diatur. Lihat panduan di komentar kode.');
      return;
    }
    setNotesLoading(true);
    setNotesError(null);
    try {
      const res = await apiGet('list');
      if (!res.ok) throw new Error(res.error || 'Gagal memuat catatan');
      setNotes(res.data || []);
    } catch (err) {
      setNotesError(err.message + ' — periksa URL deploy & akses "Anyone".');
    } finally {
      setNotesLoading(false);
    }
  };
  useEffect(() => { loadNotes(); }, []);

  const notesByDate = useMemo(() => {
    const map = {};
    notes.forEach(n => {
      if (!n || !n.tanggal) return;
      (map[n.tanggal] = map[n.tanggal] || []).push(n);
    });
    return map;
  }, [notes]);
  const selectedNotes = notesByDate[selectedKey] || [];

  useEffect(() => { closeForm(); }, [selectedKey]);

  const closeForm = () => {
    setShowForm(false);
    setEditingNote(null);
    setFormJudul('');
    setFormCatatan('');
    setFormStatus('rencana');
  };
  const openAdd = () => {
    setEditingNote(null);
    setFormJudul('');
    setFormCatatan('');
    setFormStatus('rencana');
    setShowForm(true);
  };
  const openEdit = (n) => {
    setEditingNote(n);
    setFormJudul(n.judul || '');
    setFormCatatan(n.catatan || '');
    setFormStatus(n.status === 'selesai' ? 'selesai' : 'rencana');
    setShowForm(true);
  };

  const submitForm = async () => {
    if (!formJudul.trim()) { alert('Judul catatan wajib diisi.'); return; }
    setSaving(true);
    try {
      let res;
      if (editingNote) {
        res = await apiPost({
          action: 'update', id: editingNote.id, tanggal: editingNote.tanggal,
          judul: formJudul.trim(), catatan: formCatatan.trim(), status: formStatus
        });
      } else {
        res = await apiPost({
          action: 'create', tanggal: selectedKey,
          judul: formJudul.trim(), catatan: formCatatan.trim(), status: formStatus
        });
      }
      if (!res.ok) throw new Error(res.error || 'Gagal menyimpan');
      await loadNotes();
      closeForm();
    } catch (err) {
      alert('Gagal menyimpan: ' + err.message);
    } finally {
      setSaving(false);
    }
  };

  const handleDelete = async (id) => {
    if (!confirm('Hapus catatan ini?')) return;
    try {
      const res = await apiPost({ action: 'delete', id });
      if (!res.ok) throw new Error(res.error || 'Gagal menghapus');
      await loadNotes();
    } catch (err) {
      alert('Gagal menghapus: ' + err.message);
    }
  };

  const goMonth = delta => {

  const adaDataTahun = !!HARI_LIBUR[view.y];

  /* ---------- statistik untuk sidebar ---------- */
